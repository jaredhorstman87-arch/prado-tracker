      const stockAdds = (Array.isArray(r.stock) ? r.stock : []).map(x => ({ id: String(x && x.id), qty: num(x && x.qty) || 1, unitPrice: num(x && x.unitPrice) })).filter(x => validStock.has(x.id));
      if (!pf.itemIds.length && !pf.repairs.length && stockAdds.length) return partsSheet(stockAdds, pf, files);
      serviceSheet(null, null, { prefill: pf, files, stockAdds });
    } catch (e) {
      closeSheet();
      if (!(e && e.code === 'cancelled')) toast(readError(e));
    }
  }

  const stockAddsHTML = (adds, where) => adds.length ? `<div class="field"><span class="lbl">Add to garage stock</span><div class="checks stock-adds">${adds.map((a, i) => {
      const s = state.stock.find(x => x._id === a.id);
      return `<label><input type="checkbox" data-i="${i}" checked>${esc(s ? s.name : a.id)} +${qtyFmt(a.qty)}${esc(unitOf(s))}${a.unitPrice ? ` at $${a.unitPrice.toFixed(2)}` : ''}</label>`;
    }).join('')}</div></div>` : '';

  async function applyStockAdds(sheet, adds, where, date) {
    const picked = [...sheet.querySelectorAll('.stock-adds input:checked')].map(c => adds[+c.dataset.i]).filter(Boolean);
    for (const a of picked) {
      const s = state.stock.find(x => x._id === a.id); if (!s) continue;
      const { _id, ...rest } = s;
      const upd = { ...rest, qty: Math.round(((+s.qty || 0) + a.qty) * 10) / 10 };
      if (a.unitPrice) { upd.lastPrice = a.unitPrice; upd.lastPriceWhere = where || s.lastPriceWhere || ''; upd.lastPriceDate = date || todayISO(); }
      await state.db.collection('stock').doc(_id).set(upd);
    }
    return picked.length;
  }

  function partsSheet(adds, pf, files) {
    openSheet(`<h2>Parts receipt</h2>
      <div class="from-photo">${icon('check')}Read from your photo${pf.where ? ` · ${esc(pf.where)}` : ''}${pf.date ? ` · ${fmtDate(parseDate(pf.date))}` : ''}${pf.cost ? ` · $${pf.cost.toFixed(2)}` : ''}</div>
      ${stockAddsHTML(adds)}
      <p class="note" style="margin:0">Untick anything that’s wrong. Quantities and prices update in the Stock tab.</p>
      <div class="sheet-actions"><button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="saveParts">Add to stock</button></div>`,
      (sheet) => {
        $('#saveParts', sheet).onclick = async () => { await write(async () => { const n = await applyStockAdds(sheet, adds, pf.where, pf.date); if (!n) throw { code: 'none' }; }, 'Stock updated'); };
      });
  }

  /* ---------- Garage stock ---------- */

  const qtyFmt = (n) => (Math.round(+n * 10) / 10).toLocaleString('en-AU');
  const isBlank = (v) => v == null || v === '';
  const unitOf = (x) => x && x.unit && x.unit !== 'each' ? ' ' + x.unit : '';

  function stockState(x) {
    if (isBlank(x.qty)) return 'unknown';
    if (+x.qty <= 0) return 'out';
    if (!isBlank(x.lowAt) && +x.qty <= +x.lowAt) return 'low';
    return 'ok';
  }
  function itemName(id) { return (state.items.find(i => i.id === id) || {}).name || id; }
  function priceUrl(x) { return 'https://www.google.com.au/search?tbm=shop&q=' + encodeURIComponent([x.brand, x.name, x.partNo].filter(Boolean).join(' ')); }
  function usesText(x) { return (x.uses || []).map(u => `${itemName(u.itemId)}${+u.qty > 0 ? ' (' + qtyFmt(u.qty) + unitOf(x) + ')' : ''}`).join(', '); }

  // Parts needed for a set of schedule items, compared with what's in the garage.
  function partsFor(itemIds) {
    const ids = new Set(itemIds);
    return state.stock.map(x => {
      const rel = (x.uses || []).filter(u => ids.has(u.itemId));
      if (!rel.length) return null;
      const need = rel.reduce((a, u) => a + (+u.qty || 0), 0);
      const unknownQty = rel.some(u => !(+u.qty > 0));
      const have = isBlank(x.qty) ? null : +x.qty;
      const short = have == null ? null : Math.max(0, Math.round((need - have) * 10) / 10);
      return { s: x, need, unknownQty, have, short, forIds: rel.map(u => u.itemId) };
    }).filter(Boolean);
  }

  /* ---------- DIY job cards ---------- */

  // Where each spec came from: your own value, checked by you, the video, or still to confirm.
  const SPEC_SRC = { you: ['ok', 'Yours'], confirmed: ['ok', 'Confirmed'], video: ['none', 'From video'], check: ['soon', 'To confirm'], add: ['none', 'Add'] };
  const ytAt = (job, t) => { const u = job.video && job.video.url; if (!u || t == null) return ''; return u + (u.includes('?') ? '&' : '?') + 't=' + Math.round(t) + 's'; };
  const mmss = (t) => Math.floor(t / 60) + ':' + String(Math.round(t % 60)).padStart(2, '0');
  const jobRun = (job) => state.jobruns.find(r => r._id === job._id) || null;
  const jobItemIds = (job) => [...new Set((job.itemIds || []).flatMap(id => [id, ...((state.items.find(i => i.id === id) || {}).includes || [])]))];

  function jobsHTML(cur) {
    if (!state.loaded.jobs) return '';
    const jobs = state.jobs.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    const card = (j) => {
      const steps = j.steps || [];
      const run = jobRun(j);
      const done = run ? (run.done || []).filter(id => steps.some(s => s.id === id)).length : 0;
      const item = state.items.find(i => i.id === (j.itemIds || [])[0]);
      const s = item ? statusFor(item, cur) : null;
      const toConfirm = (j.specs || []).filter(x => x.src === 'check' || x.src === 'add').length;
      const short = partsFor(j.itemIds || []).filter(p => p.short > 0);
      const pill = done ? `<span class="pill s-soon">${icon('clock')}${done} of ${steps.length}</span>`
        : s && s.state !== 'none' ? `<span class="pill s-${s.state}">${statusIcon(s.state)}${{ over: 'Overdue', soon: 'Due soon', ok: 'OK' }[s.state]}</span>` : '';
      const bits = [j.video && j.video.url ? 'Video linked' : 'No video yet', toConfirm ? `${toConfirm} spec${toConfirm === 1 ? '' : 's'} to confirm` : 'Specs confirmed'];
      return `<button class="item" type="button" data-act="open-job" data-id="${esc(j._id)}">
        <div class="item-head"><span class="ic-tile${done ? ' s-soon' : ''}">${icon(j.icon || 'wrench')}</span><div class="item-name"><span class="item-group">${steps.length} steps${j.time ? ' · ' + esc(j.time) : ''}</span>${esc(j.name)}</div>${pill}</div>
        ${done ? `<div class="bar"><i class="s-soon" style="width:${(done / steps.length * 100).toFixed(0)}%"></i></div><div class="due">In progress. Tap to carry on.</div>` : s && s.state !== 'none' ? `<div class="due">${dueLine(s)}</div>` : ''}
        <div class="sub">${bits.join(' · ')}${short.length ? ` · <span class="t-soon">buy ${esc(short.map(p => p.s.name).join(', '))}</span>` : ''}</div>
      </button>`;
    };
    return `<div style="display:grid;gap:12px"><p class="section-label">DIY job cards</p>
      <div class="list">${jobs.length ? jobs.map(card).join('') : '<div class="empty">No job cards yet.</div>'}</div></div>`;
  }

  function garageHTML(cur) {
    return `<div style="display:grid;gap:18px">${jobsHTML(cur)}
      <div style="display:grid;gap:12px"><p class="section-label">Garage stock</p>${stockHTML()}</div></div>`;
  }

  async function saveJob(j) {
    if (!state.db) { toast('Saving isn’t available in this view.'); return false; }
    const { _id, ...rest } = j;
    try { await state.db.collection('jobs').doc(_id).set(rest); return true; }
    catch (e) { toast(e && e.code === 'invalid_argument' ? 'You don’t have permission to change this page.' : 'Couldn’t save. Check your connection and try again.'); return false; }
  }

  function jobSheet(job) {
    const steps = job.steps || [];
    const run = jobRun(job);
    const done = new Set(run ? run.done || [] : []);
    const hasVideo = !!(job.video && job.video.url);
    const phases = [];
    steps.forEach(s => { let p = phases.find(x => x.name === s.phase); if (!p) phases.push(p = { name: s.phase, steps: [] }); p.steps.push(s); });
    const parts = partsFor(job.itemIds || []);
    const specRows = (job.specs || []).map((x, i) => {
      const b = SPEC_SRC[x.src] || SPEC_SRC.check;
      return `<button type="button" class="spec" data-spec="${i}"><span class="spec-k">${esc(x.k)}</span>
        <span class="spec-v">${x.v ? esc(x.v) : '<span class="sub">Tap to add</span>'}${x.note ? `<span class="sub">${esc(x.note)}</span>` : ''}</span>
        <span class="pill s-${b[0]}">${b[1]}</span></button>`;
    }).join('');
    const partRows = parts.map(p => `<div><span>${esc(p.s.name)}${p.s.partNo ? ` <span class="sub">${esc(p.s.partNo)}</span>` : ''}</span>
      <span class="sub">${p.unknownQty ? '' : 'need ' + qtyFmt(p.need) + esc(unitOf(p.s)) + ' · '}${p.have == null ? 'not counted' : 'have ' + qtyFmt(p.have) + esc(unitOf(p.s))}${p.short > 0 ? ` · <b class="t-over">short ${qtyFmt(p.short)}</b>` : ''}</span></div>`).join('');
    const stepHTML = phases.map(p => `<div class="job-phase"><p class="phase-label">${esc(p.name)}</p>
      ${p.steps.map(s => `<div class="step${s.warn ? ' warn' : ''}"><label><input type="checkbox" data-step="${esc(s.id)}" ${done.has(s.id) ? 'checked' : ''}><span>${s.warn ? icon('alert') : ''}${esc(s.text)}</span></label>
        ${s.t != null && hasVideo ? `<a class="ts" href="${esc(ytAt(job, s.t))}" target="_blank" rel="noopener" aria-label="Watch this step at ${mmss(s.t)}">${icon('play')}${mmss(s.t)}</a>` : ''}</div>`).join('')}</div>`).join('');
    openSheet(`<h2>${esc(job.name)}</h2>
      <div class="sub">${esc(job.time || '')}</div>
      ${job.note ? `<p class="note" style="margin:0">${esc(job.note)}</p>` : ''}
      ${hasVideo ? `<a class="btn ghost file-btn" href="${esc(job.video.url)}" target="_blank" rel="noopener">${icon('play')}Watch the video</a>` : ''}
      <div class="job-prog"><div class="bar"><i id="jobBar"></i></div><span class="sub" id="jobCount"></span></div>
      <div class="field"><span class="lbl">Specs</span><div class="specs">${specRows}</div><span class="sub">Tap a spec to fill it in or mark it confirmed.</span></div>
      ${parts.length ? `<div class="field"><span class="lbl">Parts from the garage</span><div class="hist-mini">${partRows}</div></div>` : ''}
      ${(job.tools || []).length ? `<div class="field"><span class="lbl">Tools</span><div class="tools">${job.tools.map(t => `<span>${esc(t)}</span>`).join('')}</div></div>` : ''}
      <div class="field"><span class="lbl">Steps${hasVideo ? ' · tap the time to jump to that part of the video' : ''}</span>${stepHTML}</div>
      <div class="field"><label for="j-tips">My tips</label><textarea id="j-tips" rows="3" placeholder="Anything to remember next time, like socket sizes or a fiddly clip">${esc(job.tips || '')}</textarea></div>
      <div class="field"><label for="j-video">Video link</label><input id="j-video" type="url" inputmode="url" value="${esc(hasVideo ? job.video.url : '')}" placeholder="https://www.youtube.com/watch?v=…"></div>
      <div class="sheet-actions"><button class="btn ghost" type="button" id="jobReset">Clear ticks</button><span class="spacer"></span>
        <button class="btn ghost" type="button" id="jobSave">Save notes</button><button class="btn primary" type="button" id="jobFinish">${icon('check')}Finish and log</button></div>`,
      (sheet) => {
        sheet.classList.add('sheet-job');
        const boxes = () => [...sheet.querySelectorAll('[data-step]')];
        const ticked = () => boxes().filter(c => c.checked).map(c => c.dataset.step);
        const update = () => {
          const n = ticked().length;
          $('#jobBar', sheet).style.width = (steps.length ? n / steps.length * 100 : 0) + '%';
          $('#jobCount', sheet).textContent = n === steps.length ? 'All steps done. Finish and log it.' : `${n} of ${steps.length} steps done`;
        };
        update();
        // Ticks are saved as you go, so you can put the phone down and come back.
        let timer;
        const saveTicks = () => {
          if (!state.db) return;
          clearTimeout(timer);
          timer = setTimeout(async () => {
            const ids = ticked();
            try {
              const ref = state.db.collection('jobruns').doc(job._id);
              if (ids.length) await ref.set({ done: ids, updated: new Date().toISOString() }); else await ref.delete();
            } catch (e) { toast('Couldn’t save your ticks. Check your connection.'); }
          }, 400);
        };
        sheet.addEventListener('change', (e) => { if (e.target.matches('[data-step]')) { update(); saveTicks(); } });
        const edited = () => {
          const url = $('#j-video', sheet).value.trim();
          return { ...job, tips: $('#j-tips', sheet).value.trim(), video: url ? { url, title: (job.video && job.video.title) || '' } : null };
        };
        sheet.querySelectorAll('[data-spec]').forEach(b => { b.onclick = () => specSheet(edited(), +b.dataset.spec); });
        $('#jobReset', sheet).onclick = () => { boxes().forEach(c => { c.checked = false; }); update(); saveTicks(); };
        $('#jobSave', sheet).onclick = async () => {
          const nj = edited();
          if (nj.video && !/^https?:\/\//i.test(nj.video.url)) return toast('The video link should start with https://');
          if (await saveJob(nj)) { job = nj; toast('Notes saved'); }
        };
        let armed = false;
        $('#jobFinish', sheet).onclick = async () => {
          const left = steps.length - ticked().length;
          if (left > 0 && !armed) {
            armed = true;
            $('#jobFinish', sheet).innerHTML = `${left} not ticked. Log anyway?`;
            return;
          }
          const nj = edited();
          if ((nj.tips || '') !== (job.tips || '') || JSON.stringify(nj.video || null) !== JSON.stringify(job.video || null)) await saveJob(nj);
          clearTimeout(timer);
          serviceSheet(null, jobItemIds(job), { where: 'Me (DIY)', onSaved: () => state.db.collection('jobruns').doc(job._id).delete().catch(() => {}) });
        };
      });
  }

  function specSheet(job, i) {
    const x = job.specs[i];
    const mine = x.src === 'you' || x.src === 'confirmed';
    openSheet(`<h2>${esc(x.k)}</h2>
      <div class="sub">${esc(job.name)} · ${(SPEC_SRC[x.src] || SPEC_SRC.check)[1]}</div>
      <div class="field"><label for="sp-v">Value</label><input id="sp-v" value="${esc(x.v || '')}"></div>
      <div class="field"><label for="sp-n">Note</label><textarea id="sp-n" rows="2">${esc(x.note || '')}</textarea></div>
      <label class="deduct"><input type="checkbox" id="sp-ok" ${mine ? 'checked' : ''}><span>Confirmed. I’ve checked this against a manual, the part box or my own car.</span></label>
      <div class="sheet-actions"><button class="btn ghost" type="button" id="sp-back">Back</button><span class="spacer"></span><button class="btn primary" type="button" id="sp-save">Save</button></div>`,
      (sheet) => {
        $('#sp-back', sheet).onclick = () => jobSheet(job);
        $('#sp-save', sheet).onclick = async () => {
          const v = $('#sp-v', sheet).value.trim();
          const ok = $('#sp-ok', sheet).checked;
          const src = ok ? (x.src === 'you' ? 'you' : 'confirmed') : mine ? 'check' : x.src === 'add' && v ? 'check' : x.src;
          const nj = { ...job, specs: job.specs.map((s, j) => j === i ? { ...s, v, note: $('#sp-n', sheet).value.trim(), src } : s) };
          if (await saveJob(nj)) { toast('Spec saved'); jobSheet(nj); }
        };
      });
  }

  function stockHTML() {
    if (!state.loaded.stock) return `<div class="empty">Loading your stock…</div>`;
    const label = { out: ['over', 'Out'], low: ['soon', 'Low'], ok: ['ok', 'In stock'], unknown: ['none', 'Not counted'] };
    const rank = { out: 0, low: 1, unknown: 2, ok: 3 };
    const sorted = state.stock.slice().sort((a, b) => rank[stockState(a)] - rank[stockState(b)] || String(a.name).localeCompare(String(b.name)));
    const card = (x) => {
      const st = stockState(x);
      return `<button class="item" type="button" data-act="open-stock" data-id="${esc(x._id)}">
        <div class="item-head"><span class="ic-tile s-${label[st][0]}">${icon(stockIcon(x))}</span><div class="item-name"><span class="item-group">${esc([x.brand, x.partNo].filter(Boolean).join(' · '))}</span>${esc(x.name)}</div><span class="pill s-${label[st][0]}">${statusIcon(label[st][0])}${label[st][1]}</span></div>
        <div class="due">${isBlank(x.qty) ? 'Quantity not counted yet' : `<b>${qtyFmt(x.qty)}${esc(unitOf(x))}</b> in the garage`}${!isBlank(x.lowAt) ? ` · low at ${qtyFmt(x.lowAt)}` : ''}</div>
        ${usesText(x) ? `<div class="sub">For ${esc(usesText(x))}</div>` : ''}
        ${!isBlank(x.lastPrice) ? `<div class="sub">Last paid $${Number(x.lastPrice).toFixed(2)}${x.lastPriceWhere ? ' at ' + esc(x.lastPriceWhere) : ''}${x.lastPriceDate ? ' · ' + fmtDate(parseDate(x.lastPriceDate)) : ''}</div>` : ''}
      </button>`;
    };
    return `<div style="display:grid;gap:12px">
      <div class="list">${sorted.length ? sorted.map(card).join('') : '<div class="empty">No stock items yet. Add the oils, filters and fluids you keep in the garage.</div>'}</div>
      <div class="foot"><p class="note">Set “low at” on each item and it shows as Low here, in the service plan and in your weekly check, which also looks up current prices for anything low. Logging a DIY service can take the parts out of stock for you.</p><button class="btn" type="button" data-act="add-stock">${icon('plus')}Add stock item</button></div>
    </div>`;
  }

  function stockSheet(x) {
    const isNew = !x;
    x = x || { name: '', brand: '', partNo: '', unit: 'each', qty: null, lowAt: null, uses: [], lastPrice: null, lastPriceWhere: '', lastPriceDate: null, buyUrl: '', notes: '' };
    const items = state.items.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    const useRow = (u) => `<div class="use-row"><select class="u-item" aria-label="Schedule item"><option value="">Schedule item…</option>${items.map(i => `<option value="${esc(i.id)}" ${u && u.itemId === i.id ? 'selected' : ''}>${esc(i.name)}</option>`).join('')}</select><input class="u-qty" inputmode="decimal" aria-label="Quantity per service" placeholder="Qty" value="${u && !isBlank(u.qty) ? esc(u.qty) : ''}"><button type="button" class="btn ghost u-del" aria-label="Remove">×</button></div>`;
    const units = ['each', 'L', 'pack', 'tube'];
    if (x.unit && !units.includes(x.unit)) units.push(x.unit);
    openSheet(`<h2>${isNew ? 'Add stock item' : esc(x.name)}</h2>
      <div class="row2">
        <div class="field"><label for="s-name">Item</label><input id="s-name" value="${esc(x.name)}" placeholder="e.g. Engine oil"></div>
        <div class="field"><label for="s-brand">Brand</label><input id="s-brand" list="brandList" value="${esc(x.brand || '')}"><datalist id="brandList"><option value="Penrite"><option value="Genuine Toyota"></datalist></div>
      </div>
      <div class="row2">
        <div class="field"><label for="s-part">Part number or product</label><input id="s-part" value="${esc(x.partNo || '')}" placeholder="Part no. or grade"></div>
        <div class="field"><label for="s-unit">Unit</label><select id="s-unit">${units.map(u => `<option ${x.unit === u ? 'selected' : ''}>${esc(u)}</option>`).join('')}</select></div>
      </div>
      <div class="row2">
        <div class="field"><label for="s-qty">In the garage</label><div class="stepper"><button type="button" class="btn" data-step="-1" aria-label="One less">−</button><input id="s-qty" inputmode="decimal" value="${isBlank(x.qty) ? '' : esc(x.qty)}" placeholder="Not counted"><button type="button" class="btn" data-step="1" aria-label="One more">+</button></div></div>
        <div class="field"><label for="s-low">Low at</label><input id="s-low" inputmode="decimal" value="${isBlank(x.lowAt) ? '' : esc(x.lowAt)}" placeholder="e.g. 1"></div>
      </div>
      <div class="field"><span class="lbl">Used for (amount per service)</span><div class="use-rows" id="useRows">${(x.uses && x.uses.length ? x.uses : [null]).map(useRow).join('')}</div><button type="button" class="btn ghost file-btn" id="addUse">Add another</button></div>
      <div class="row2">
        <div class="field"><label for="s-price">Last price paid $</label><input id="s-price" inputmode="decimal" value="${isBlank(x.lastPrice) ? '' : esc(x.lastPrice)}"></div>
        <div class="field"><label for="s-where">Bought from</label><input id="s-where" value="${esc(x.lastPriceWhere || '')}" placeholder="e.g. Toyota parts, Repco"></div>
      </div>
      <div class="field"><label for="s-url">Usual supplier link (optional)</label><input id="s-url" inputmode="url" value="${esc(x.buyUrl || '')}" placeholder="https://"></div>
      <div class="field"><label for="s-notes">Notes</label><textarea id="s-notes" rows="2">${esc(x.notes || '')}</textarea></div>
      <p class="note" style="margin:0"><a id="s-find" href="${priceUrl(x)}" target="_blank" rel="noopener">Compare prices online</a>${x.buyUrl ? ` · <a href="${esc(x.buyUrl)}" target="_blank" rel="noopener">Your usual supplier</a>` : ''}</p>
      <div id="confirmBox"></div>
      <div class="sheet-actions">${isNew ? '' : '<button class="btn danger ghost" type="button" data-act="ask-del">Delete</button><span class="spacer"></span>'}
        <button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="s-save">Save</button></div>`,
      (sheet) => {
        const num = (v) => { const t = String(v).replace(/[^0-9.]/g, ''); return t === '' ? null : Number(t); };
        sheet.querySelectorAll('[data-step]').forEach(b => { b.onclick = () => { const q = $('#s-qty', sheet); q.value = Math.max(0, (num(q.value) || 0) + Number(b.dataset.step)); }; });
        const rows = $('#useRows', sheet);
        rows.addEventListener('click', (e) => { const d = e.target.closest('.u-del'); if (d) d.closest('.use-row').remove(); });
        $('#addUse', sheet).onclick = () => rows.insertAdjacentHTML('beforeend', useRow(null));
        const updFind = () => { $('#s-find', sheet).href = priceUrl({ brand: $('#s-brand', sheet).value, name: $('#s-name', sheet).value, partNo: $('#s-part', sheet).value }); };
        ['#s-brand', '#s-name', '#s-part'].forEach(id => $(id, sheet).addEventListener('input', updFind));
        $('#s-save', sheet).onclick = async () => {
          const name = $('#s-name', sheet).value.trim();
          if (!name) return toast('Give the item a name.');
          const uses = [...rows.querySelectorAll('.use-row')].map(r => ({ itemId: $('.u-item', r).value, qty: num($('.u-qty', r).value) })).filter(u => u.itemId);
          const url = $('#s-url', sheet).value.trim();
          const price = num($('#s-price', sheet).value);
          const priceChanged = price !== (isBlank(x.lastPrice) ? null : +x.lastPrice);
          const data = {
            name, brand: $('#s-brand', sheet).value.trim(), partNo: $('#s-part', sheet).value.trim(), unit: $('#s-unit', sheet).value,
            qty: num($('#s-qty', sheet).value), lowAt: num($('#s-low', sheet).value), uses,
            lastPrice: price, lastPriceWhere: $('#s-where', sheet).value.trim(),
            lastPriceDate: price == null ? null : priceChanged ? todayISO() : (x.lastPriceDate || null),
            buyUrl: /^https?:\/\//i.test(url) ? url : '', notes: $('#s-notes', sheet).value.trim()
          };
          await write(() => isNew ? state.db.collection('stock').add(data) : state.db.collection('stock').doc(x._id).set(data), isNew ? 'Stock item added' : 'Stock updated');
        };
        if (!isNew) wireDelete(sheet, `“${x.name}” from stock`, () => state.db.collection('stock').doc(x._id).delete());
      });
  }

  /* ---------- Next up ---------- */

  // The single most urgent job, comparing km and time limits in days at the usual driving rate.
  function nextUpHTML(withStatus, cur) {
    const rate = (cur && cur.rate) || 40;
    const cand = withStatus.filter(x => x.s.state !== 'none');
    if (!cand.length) return '';
    const kmDays = (s) => s.kmLeft != null ? s.kmLeft / rate : Infinity;
    const timeDays = (s) => s.daysLeft != null ? s.daysLeft : Infinity;
    cand.sort((a, b) => Math.min(kmDays(a.s), timeDays(a.s)) - Math.min(kmDays(b.s), timeDays(b.s)));
    const { item, s } = cand[0];
    let big, unit, alt = '';
    const span = (d) => d > 60 ? `${Math.round(d / 30.4)} months` : `${d} ${d === 1 ? 'day' : 'days'}`;
    // Lead with km whenever the item has a km limit, unless it is overdue on time only.
    if (s.kmLeft != null && !(s.daysLeft != null && s.daysLeft < 0 && s.kmLeft >= 0)) {
      big = fmtKm(Math.abs(s.kmLeft)); unit = s.kmLeft < 0 ? 'km overdue' : 'km to go';
      if (s.daysLeft != null && s.daysLeft >= 0) alt = `or ${span(s.daysLeft)}`;
    } else {
      const d = Math.abs(s.daysLeft); big = d > 60 ? Math.round(d / 30.4) : d; unit = (d > 60 ? 'months' : d === 1 ? 'day' : 'days') + (s.daysLeft < 0 ? ' overdue' : ' to go');
      if (s.kmLeft != null && s.kmLeft >= 0) alt = `or ${fmtKm(s.kmLeft)} km`;
    }
    const frac = s.state === 'over' ? 1 : clamp(s.frac || 0, 0.02, 1);
    const C = 2 * Math.PI * 27;
    const ring = `<svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" class="ring-track"/><circle cx="32" cy="32" r="27" class="ring-fill s-${s.state}" stroke-dasharray="${(C * frac).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/></svg>`;
    const sub = subLine(s);
    return `<button class="nextup s-${s.state}" type="button" data-act="open-item" data-id="${esc(item.id)}" aria-label="Next up: ${esc(item.name)}, ${big} ${unit}">
      <span class="nu-ring">${ring}<span class="nu-ic">${icon(iconFor(item))}</span></span>
      <span class="nu-body"><span class="nu-label">${s.state === 'over' ? 'Overdue' : 'Next up'}</span><span class="nu-name">${esc(item.name)}</span>
        <span class="nu-count"><b>${big}</b> ${unit}${alt ? ` <span class="nu-alt">${alt}</span>` : ''}</span>${sub ? `<span class="nu-sub">${sub}</span>` : ''}</span>
    </button>`;
  }

  /* ---------- Next-service planner ---------- */

  function plannerHTML(withStatus, cur) {
    const win = state.planKm;
    const rate = cur && cur.rate;
    const winDays = rate ? Math.round(win / rate) : Math.round(win / 5000 * 120);
    const jobs = withStatus.filter(({ s }) => s.state === 'over' || s.state === 'soon' || (s.kmLeft != null && s.kmLeft <= win) || (s.daysLeft != null && s.daysLeft <= winDays));
    const daysTo = (s) => Math.min(s.daysLeft != null ? s.daysLeft : Infinity, s.kmLeft != null ? (rate ? s.kmLeft / rate : s.kmLeft / 40) : Infinity);
    jobs.sort((a, b) => daysTo(a.s) - daysTo(b.s));
    const parts = jobs.length ? partsFor(jobs.map(j => j.item.id)) : [];
    const toBuy = parts.filter(p => p.short > 0 || p.have === 0);
    const notCounted = parts.filter(p => p.have == null);
    const inPlan = new Set(parts.map(p => p.s._id));
    const alsoLow = state.stock.filter(x => ['low', 'out'].includes(stockState(x)) && !inPlan.has(x._id));
    const buyCount = toBuy.length + alsoLow.length;

    // Collapsed summary: answers "what's coming and am I ready?" at a glance.
    const badges = [];
    badges.push(`<span class="pbadge">${icon('wrench')}${jobs.length ? `${jobs.length} ${jobs.length === 1 ? 'job' : 'jobs'}` : 'No jobs'}</span>`);
    if (jobs.length && parts.length) {
      if (buyCount) badges.push(`<span class="pbadge warn">${icon('cart')}${buyCount} to buy</span>`);
      else if (notCounted.length) badges.push(`<span class="pbadge">${icon('question')}Count stock</span>`);
      else badges.push(`<span class="pbadge good">${icon('check')}Parts ready</span>`);
    } else if (buyCount) badges.push(`<span class="pbadge warn">${icon('cart')}${buyCount} to buy</span>`);

    const chips = [2000, 5000, 10000].map(k => `<button type="button" class="seg-btn" data-act="plan-win" data-km="${k}" aria-pressed="${k === win}">${fmtKm(k)} km</button>`).join('');
    const span = rate ? `about ${Math.max(1, Math.round(winDays / 30.4))} ${Math.round(winDays / 30.4) === 1 ? 'month' : 'months'} of driving` : '';
    let body;
    if (!jobs.length) {
      body = `<p class="sub" style="margin:0">Nothing due in the next ${fmtKm(win)} km${span ? ` (${span})` : ''}. Try a longer look-ahead.</p>`;
    } else {
      const first = jobs[0].s;
      const by = [first.dueKm != null ? fmtKm(first.dueKm) + ' km' : '', first.dueDate ? fmtDate(first.dueDate) : ''].filter(Boolean).join(' or ');
      const jobList = jobs.map(({ item, s }) => `<li><span class="pl-name">${icon(iconFor(item))}${esc(item.name)}${item.doneBy === 'mechanic' ? ' <span class="mech-tag">Mechanic</span>' : ''}</span><span class="pq">${s.state === 'over' ? '<span class="short">Overdue</span>' : s.dueKm != null ? 'at ' + fmtKm(s.dueKm) + ' km' : s.dueDate ? 'by ' + fmtDate(s.dueDate) : ''}</span></li>`).join('');
      const partList = parts.map(p => {
        const isShort = p.short > 0 || p.have === 0;
        const mark = p.have == null ? `<span class="pmark">${icon('question')}</span>` : isShort ? `<span class="pmark bad">${icon('cart')}</span>` : `<span class="pmark ok">${icon('check')}</span>`;
        const needTxt = p.need > 0 ? `need ${qtyFmt(p.need)}${p.unknownQty ? '+' : ''}${esc(unitOf(p.s))}` : 'amount not set';
        const haveTxt = p.have == null ? 'not counted' : `have ${qtyFmt(p.have)}`;
        const buy = isShort ? ` · <a href="${priceUrl(p.s)}" target="_blank" rel="noopener">buy ${p.short > 0 ? qtyFmt(p.short) + esc(unitOf(p.s)) : ''}</a>` : '';
        return `<li><span class="pl-name">${mark}${esc(p.s.name)}</span><span class="pq${isShort ? ' short' : ''}">${needTxt} · ${haveTxt}${buy}</span></li>`;
      }).join('');
      const covered = new Set(parts.flatMap(p => p.forIds));
      const unlinked = jobs.filter(j => !covered.has(j.item.id) && j.item.doneBy !== 'mechanic').map(j => j.item.name);
      const mech = jobs.filter(j => j.item.doneBy === 'mechanic').map(j => j.item.name);
      body = `<div class="plan-when">${jobs.length === 1 ? 'Due' : 'First one due'} by <b>${by}</b>${first.predicted && (!first.dueDate || first.predicted < first.dueDate) ? `, likely around ${fmtMonth(first.predicted)}` : ''}.${jobs.length > 1 ? ' Worth doing the others at the same time if they’re close.' : ''}</div>
        <p class="plan-h">1. Jobs to do</p><ul class="plan-list">${jobList}</ul>
        ${parts.length ? `<p class="plan-h">2. Parts check</p><ul class="plan-list">${partList}</ul>` : ''}
        ${notCounted.length ? `<p class="note" style="margin:0">Count ${esc(notCounted.map(p => p.s.name).join(', '))} in the Stock tab and this will tell you exactly what to buy.</p>` : ''}
        ${mech.length ? `<p class="note" style="margin:0">Book a mechanic for ${esc(mech.join(', '))}. They supply the parts and fluids.</p>` : ''}
        ${unlinked.length ? `<p class="note" style="margin:0">No parts linked to ${esc(unlinked.join(', '))} yet. Link them from the Stock tab.</p>` : ''}`;
    }
    const lowHTML = alsoLow.length ? `<p class="plan-h">Also running low</p><ul class="plan-list">${alsoLow.map(x => `<li><span class="pl-name"><span class="pmark bad">${icon('cart')}</span>${esc(x.name)}</span><span class="pq short">${qtyFmt(x.qty)}${esc(unitOf(x))} left · <a href="${priceUrl(x)}" target="_blank" rel="noopener">buy</a></span></li>`).join('')}</ul>` : '';
    return `<details class="panel planner"${state.planOpen ? ' open' : ''}>
      <summary>
        <span class="pl-head"><h3>${icon('cart')}Service prep</h3><span class="pl-badges">${badges.join('')}</span></span>
        <span class="pl-explain">What's coming up in the next ${fmtKm(win)} km and the parts you'll need. Tap to ${state.planOpen ? 'hide' : 'see'} the list.</span>
      </summary>
      <div class="planner-body"><div class="seg" role="group" aria-label="Look ahead"><span class="seg-lbl">Look ahead</span>${chips}</div>${body}${lowHTML}</div>
    </details>`;
  }


  /* ---------- Spending ---------- */

  const money = (n) => '$' + Math.round(n).toLocaleString('en-AU');

  // Splits one entry's cost into servicing / repairs / mixed (a visit with both and no split given).
  function costSplit(l) {
    const c = +l.cost || 0;
    if (!(c > 0)) return null;
    const hasI = (l.itemIds || []).length > 0, hasR = (l.repairs || []).length > 0;
    if (l.repairCost != null && l.repairCost !== '' && !isNaN(+l.repairCost)) { const r = clamp(+l.repairCost, 0, c); return { service: c - r, repair: r, mixed: 0, total: c }; }
    if (hasR && !hasI) return { service: 0, repair: c, mixed: 0, total: c };
    if (!hasR) return { service: c, repair: 0, mixed: 0, total: c };
    return { service: 0, repair: 0, mixed: c, total: c };
  }

  /* ---------- True cost of ownership ---------- */

  const OWN_CATS = [['dep', 'Value lost', 'own-1'], ['mech', 'Mechanic and Toyota', 'own-2'], ['diy', 'DIY parts', 'own-3'], ['run', 'Rego and insurance', 'own-4'], ['tyre', 'Tyres', 'own-5']];
  const RUN_KINDS = ['rego', 'ctp', 'inspection', 'insurance', 'roadside'];
  const carMeta = () => state.meta.find(x => x._id === 'car') || {};
  const latestValuation = () => state.valuations.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || (+b.ts || 0) - (+a.ts || 0))[0] || null;
  // DIY if you said so, or if nothing says who did it and none of the jobs are mechanic jobs.
  const isDIY = (l) => /\b(me|diy)\b/i.test(l.where || '') || (!String(l.where || '').trim() && !(+l.cost > 0) && (l.itemIds || []).length > 0 && !(l.repairs || []).length && (l.itemIds || []).every(id => (state.items.find(i => i.id === id) || {}).doneBy !== 'mechanic'));

  // Parts cost for a DIY entry with no cost, priced from what you last paid for each part in stock.
  function diyEstimate(l) {
    let sum = 0, missing = 0;
    partsFor(l.itemIds || []).forEach(p => {
      if (!(p.need > 0)) return;
      if (isBlank(p.s.lastPrice)) missing++; else sum += p.need * +p.s.lastPrice;
    });
    return { sum, missing };
  }

  function ownership(cur) {
    const car = carMeta();
    const pDate = car.purchaseDate ? parseDate(car.purchaseDate) : null;
    const today = startOfToday();
    const years = pDate ? Math.max(daysBetween(pDate, today), 1) / 365.25 : null;
    const kmOwned = cur && car.purchaseKm ? Math.max(0, cur.km - car.purchaseKm) : null;
    const owned = (l) => pDate ? (l.date ? parseDate(l.date) >= pDate : (+l.km || 0) > +(car.purchaseKm || 0)) : true;
    const logs = state.logs.filter(owned);
    const c = { dep: 0, mech: 0, diy: 0, run: 0, tyre: 0 };
    const info = { mechN: 0, diyN: 0, diyEst: 0, diyMissing: 0, uncostedMech: 0 };
    logs.forEach(l => {
      const cost = +l.cost || 0;
      if (isDIY(l)) {
        info.diyN++;
        if (cost > 0) c.diy += cost;
        else { const e = diyEstimate(l); c.diy += e.sum; if (e.sum > 0) info.diyEst++; if (e.missing) info.diyMissing++; }
      } else if (cost > 0) { c.mech += cost; info.mechN++; }
      else info.uncostedMech++;
    });
    const runs = state.renewals.filter(r => RUN_KINDS.includes(r.kind));
    const runMissing = runs.filter(r => isBlank(r.cost));
    if (years) runs.forEach(r => { if (!isBlank(r.cost)) c.run += +r.cost * years; });
    const tyres = state.tyres.filter(t => !pDate || !t.fittedDate || parseDate(t.fittedDate) >= pDate);
    tyres.forEach(t => { if (!isBlank(t.cost)) c.tyre += +t.cost; });
    const tyreMissing = tyres.filter(t => isBlank(t.cost));
    const val = latestValuation();
    const price = isBlank(car.purchasePrice) ? null : +car.purchasePrice;
    if (val && price != null) c.dep = Math.max(0, price - +val.value);
    const spend = c.mech + c.diy + c.run + c.tyre;
    const net = spend + c.dep;
    return { car, pDate, years, kmOwned, c, info, runs, runMissing, tyres, tyreMissing, val, price, spend, net,
      perYear: years ? net / years : null, perKm: kmOwned >= 1000 ? net / kmOwned : null };
  }

  function ownershipHTML(cur) {
    const o = ownership(cur);
    const { c, car, val } = o;
    if (o.price == null) return `<div class="sec"><p class="section-label">True cost of ownership</p><div class="panel"><p class="sub" style="margin:0">Add what you paid for the car to see what it really costs to own.</p><button class="btn file-btn" type="button" data-act="car-details">${icon('dollar')}Add purchase details</button></div></div>`;
    const yrsTxt = o.years ? (o.years < 2 ? `${Math.round(o.years * 12)} months` : `${o.years.toFixed(1)} years`) : null;
    const total = OWN_CATS.reduce((a, [k]) => a + c[k], 0);
    const segs = OWN_CATS.filter(([k]) => c[k] > 0).map(([k, l, cls]) => `<i class="${cls}" style="flex-grow:${c[k].toFixed(0)}" title="${l}: ${money(c[k])} (${Math.round(c[k] / total * 100)}%)"></i>`).join('');
    const subFor = {
      dep: val ? `${money(o.price)} paid, worth about ${money(val.value)} now` : 'Needs a current value',
      mech: `${o.info.mechN} ${o.info.mechN === 1 ? 'invoice' : 'invoices'}${o.info.uncostedMech ? ` · ${o.info.uncostedMech} without a cost` : ''}`,
      diy: o.info.diyN ? `${o.info.diyN} DIY ${o.info.diyN === 1 ? 'job' : 'jobs'}${o.info.diyEst ? ' · partly priced from your stock prices' : ''}${o.info.diyMissing ? ` · ${o.info.diyMissing} missing part prices` : ''}` : 'No DIY jobs logged since purchase',
      run: o.runs.length ? (o.runMissing.length === o.runs.length ? 'Add yearly costs to your renewals' : `Estimated: yearly costs × ${yrsTxt || 'years owned'}${o.runMissing.length ? ` · ${o.runMissing.length} without a cost` : ''}`) : 'Add your renewals',
      tyre: o.tyres.length ? (o.tyreMissing.length ? `${o.tyreMissing.length} ${o.tyreMissing.length === 1 ? 'set' : 'sets'} without a cost` : `${o.tyres.length} ${o.tyres.length === 1 ? 'set' : 'sets'}`) : 'No tyre sets added yet'
    };
    const legend = OWN_CATS.map(([k, l, cls]) => `<li><i class="sw ${cls}"></i><span class="own-l"><b>${l}</b><span class="sub">${subFor[k]}</span></span><span class="own-v">${c[k] > 0 ? money(c[k]) : '–'}</span></li>`).join('');
    const gaps = [];
    o.runMissing.forEach(r => gaps.push(`<button type="button" class="chip chip-btn" data-act="open-renewal" data-id="${esc(r._id)}">${icon('plus')}${esc(r.name.split(' (')[0])} cost</button>`));
    o.tyreMissing.forEach(t => gaps.push(`<button type="button" class="chip chip-btn" data-act="open-tyre" data-id="${esc(t._id)}">${icon('plus')}Tyre cost</button>`));
    if (!o.tyres.length) gaps.push(`<button type="button" class="chip chip-btn" data-act="add-tyre">${icon('plus')}Tyres</button>`);
    const comps = val && Array.isArray(val.comps) ? val.comps.slice().sort((a, b) => Math.abs((+a.km || 0) - (cur ? cur.km : 0)) - Math.abs((+b.km || 0) - (cur ? cur.km : 0))) : [];
    const compHTML = comps.length ? `<details class="comps"><summary>${comps.length} comparisons used</summary>
      <div class="hist-mini">${comps.map(x => `<div><span>${esc(x.year || '')} ${esc(x.title || 'Altitude')} <span class="sub">${x.km ? fmtKm(x.km) + ' km' : ''}${x.where ? ' · ' + esc(x.where) : ''}</span></span><span>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${money(x.price)}</a>` : money(x.price)}</span></div>`).join('')}</div></details>` : '';
    return `<div class="sec"><p class="section-label">True cost of ownership</p>
      <div class="panel">
        <div class="own-hero">
          <span class="lbl">${val ? 'Cost of owning it so far' : 'Spent since you bought it'}</span>
          <span class="own-big">${money(val ? o.net : o.spend)}</span>
          <span class="sub">${[o.perYear != null && val ? `<b>${money(o.perYear)}</b> a year` : null, o.perKm != null && val ? `<b>$${o.perKm.toFixed(2)}</b> a km` : null, yrsTxt && o.kmOwned != null ? `over ${yrsTxt} and ${fmtKm(o.kmOwned)} km` : null].filter(Boolean).join(' · ')}</span>
        </div>
        ${segs ? `<div class="own-bar" role="img" aria-label="Breakdown: ${OWN_CATS.filter(([k]) => c[k] > 0).map(([k, l]) => `${l} ${money(c[k])}`).join(', ')}">${segs}</div>` : ''}
        <ul class="own-legend">${legend}</ul>
        ${gaps.length ? `<div class="own-gaps"><span class="sub">Add these to make it more accurate:</span><div class="summary">${gaps.join('')}</div></div>` : ''}
        <details class="more"><summary>${val ? `Worth about ${money(val.value)} now. How that’s worked out` : 'Set the car’s value'}</summary>
          ${val ? `<p class="sub" style="margin:0">${val.low && val.high ? `Range ${money(val.low)} to ${money(val.high)}. ` : ''}${val.source === 'manual' ? 'Your own estimate' : 'Estimated from comparable listings'}, ${fmtDate(parseDate(val.date))}.${val.note ? ' ' + esc(val.note) : ''}</p>${compHTML}`
            : '<p class="sub" style="margin:0">No value yet. Your weekly check looks up comparable listings once a month, or set a value yourself.</p>'}
          <p class="sub" style="margin:0">Bought ${o.pDate ? (car.purchaseDateApprox ? 'about ' + fmtMonth(o.pDate) : fmtDate(o.pDate)) : '(date not set)'}${car.purchaseKm ? ' at ' + fmtKm(car.purchaseKm) + ' km' : ''} for ${money(o.price)}.</p>
          <div class="actions backup-actions"><button class="btn" type="button" data-act="set-value">${icon('dollar')}Set value</button><button class="btn ghost" type="button" data-act="car-details">Car details</button></div>
        </details>
      </div></div>`;
  }

  function carDetailsSheet() {
    const car = carMeta();
    openSheet(`<h2>Car details</h2>
      <div class="row2">
        <div class="field"><label for="cd-price">Purchase price $</label><input id="cd-price" inputmode="decimal" value="${isBlank(car.purchasePrice) ? '' : esc(car.purchasePrice)}"></div>
        <div class="field"><label for="cd-date">Purchase date</label><input id="cd-date" type="date" value="${esc(car.purchaseDate || '')}"></div>
      </div>
      ${car.purchaseDateApprox ? '<p class="note" style="margin:0">The date is an estimate from your timing belt record. Change it to the real date if you have it.</p>' : ''}
      <div class="row2">
        <div class="field"><label for="cd-km">Km when bought</label><input id="cd-km" inputmode="numeric" value="${isBlank(car.purchaseKm) ? '' : esc(car.purchaseKm)}"></div>
        <div class="field"><label for="cd-grade">Grade</label><input id="cd-grade" value="${esc(car.grade || '')}" placeholder="e.g. Altitude"></div>
      </div>
      <div class="sheet-actions"><button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="cd-save">Save</button></div>`,
      (sheet) => {
        $('#cd-save', sheet).onclick = async () => {
          const num = (v) => { const t = String(v).replace(/[^0-9.]/g, ''); return t === '' ? null : Number(t); };
          const { _id, ...rest } = car;
          const date = $('#cd-date', sheet).value || null;
          const d = { ...rest, purchasePrice: num($('#cd-price', sheet).value), purchaseDate: date, purchaseKm: num($('#cd-km', sheet).value), grade: $('#cd-grade', sheet).value.trim() };
          if (date !== (car.purchaseDate || null)) d.purchaseDateApprox = false;
          await write(() => state.db.collection('meta').doc('car').set(d), 'Car details saved');
        };
      });
  }

  function valueSheet() {
    const val = latestValuation();
    openSheet(`<h2>Set the car’s value</h2>
      <p class="note" style="margin:0">Use this if you get a trade-in offer, an insurance agreed value or a dealer quote. Your monthly listing check will add a new estimate on top later.</p>
      <div class="field"><label for="v-val">Value $</label><input id="v-val" inputmode="decimal" placeholder="${val ? Math.round(val.value) : ''}"></div>
      <div class="field"><label for="v-note">Where it came from</label><input id="v-note" placeholder="e.g. Trade-in offer from dealer"></div>
      <div class="sheet-actions"><button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="v-save">Save</button></div>`,
      (sheet) => {
        $('#v-save', sheet).onclick = async () => {

          if (!(v > 0)) return toast('Enter a value.');
          const d = { date: todayISO(), ts: Date.now(), value: v, source: 'manual', note: $('#v-note', sheet).value.trim() };
          await write(() => state.db.collection('valuations').doc('manual-' + Date.now()).set(d), 'Value saved');

      });
