<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<!-- Phase 3: the Supabase stand-in for window.claude, loaded before the app script -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="supabase-claude.js"></script>
</head>
<body>
<title>Prado Service Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column. A dark instrument-cluster panel up top, red as the signature accent, white and graphite below — Toyota 4x4 workshop feel without any badges. */
:root {
  --bg: #efefed;
  --surface: #ffffff;
  --surface-2: #e4e5e6;
  --fg: #16181a;
  --muted: #5d6166;
  --line: #d6d8da;
  --accent: #d10f1e;
  --accent-fg: #ffffff;
  --ok: #2f7a45;
  --soon: #b06a00;
  --over: #8f1d1d;
  --none: #7a7e83;
  --cluster: #141618;
  --cluster-2: #23262a;
  --cluster-line: #3a3e43;
  --cluster-fg: #f3f4f5;
  --cluster-muted: #a7abb1;
  --odo-bg: #000000;
  --odo-fg: #ffffff;
  --c-service: #4f7a36;
  --c-repair: #2f6db0;
  --cmp-1: #2a78d6; --cmp-2: #eb6834; --cmp-3: #1baf7a;
  --own-1: #2a78d6; --own-2: #eb6834; --own-3: #1baf7a; --own-4: #eda100; --own-5: #e87ba4;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f10; --surface: #17191b; --surface-2: #222528; --fg: #ececed; --muted: #a0a4aa;
    --line: #2b2e32; --accent: #e8202f; --accent-fg: #ffffff; --ok: #5fbf78; --soon: #e3a239;
    --over: #ff7a70; --none: #8d9197; --cluster: #050607; --cluster-2: #1a1c1f; --cluster-line: #34383d;
    --cluster-fg: #f3f4f5; --cluster-muted: #a7abb1; --odo-bg: #000000; --odo-fg: #ffffff;
    --c-service: #719a48; --c-repair: #4f8fd8; --cmp-1: #3987e5; --cmp-2: #d95926; --cmp-3: #199e70; --own-1: #3987e5; --own-2: #d95926; --own-3: #199e70; --own-4: #c98500; --own-5: #d55181; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e0f10; --surface: #17191b; --surface-2: #222528; --fg: #ececed; --muted: #a0a4aa;
  --line: #2b2e32; --accent: #e8202f; --accent-fg: #ffffff; --ok: #5fbf78; --soon: #e3a239;
  --over: #ff7a70; --none: #8d9197; --cluster: #050607; --cluster-2: #1a1c1f; --cluster-line: #34383d;
  --cluster-fg: #f3f4f5; --cluster-muted: #a7abb1; --odo-bg: #000000; --odo-fg: #ffffff;
  --c-service: #719a48; --c-repair: #4f8fd8; --cmp-1: #3987e5; --cmp-2: #d95926; --cmp-3: #199e70; --own-1: #3987e5; --own-2: #d95926; --own-3: #199e70; --own-4: #c98500; --own-5: #d55181; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Header */
.car { display: grid; gap: 14px; }
.car-id { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; padding-bottom: 10px; border-bottom: 4px solid var(--accent); }
.car-id h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 36px; letter-spacing: .02em; text-transform: uppercase; line-height: .95; text-wrap: balance; }
.theme-btn { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 4px 10px; }
.theme-btn .half { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid currentColor; background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.car-id .spec { font-family: var(--display); font-weight: 600; font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.odo-card { background: var(--cluster); color: var(--cluster-fg); border-radius: 8px; padding: 16px; display: grid; gap: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); }
.odo-card .odo-meta { color: var(--cluster-muted); }
.odo-card .odo-meta strong { color: var(--cluster-fg); }
.odo-card .btn:not(.primary) { background: var(--cluster-2); color: var(--cluster-fg); border-color: var(--cluster-line); }
.odo-card .odo .unit { color: var(--accent); opacity: 1; font-weight: 700; }
.odo-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.odo { display: inline-flex; gap: 3px; background: var(--odo-bg); padding: 6px; border-radius: 8px; }
.odo span { font-family: var(--mono); font-weight: 700; font-size: 26px; color: var(--odo-fg); width: 1.15em; text-align: center; padding: 2px 0; border-radius: 3px; background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 45%, rgba(0,0,0,.25)); font-variant-numeric: tabular-nums; }
.odo .unit { width: auto; padding: 2px 4px; font-size: 13px; font-weight: 500; background: none; color: var(--odo-fg); opacity: .7; align-self: flex-end; }
.odo-meta { font-size: 13px; color: var(--muted); display: grid; gap: 2px; min-width: 0; }
.odo-meta strong { color: var(--fg); font-weight: 600; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface-2); padding: 10px 16px; border-radius: 4px; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--over); }
.btn.ghost { background: none; }
.btn:disabled { opacity: .5; cursor: default; }

/* Summary chips */
.summary { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--none); flex: none; }
.s-over .dot, .dot.s-over { background: var(--over); }
.s-soon .dot, .dot.s-soon { background: var(--soon); }
.s-ok .dot, .dot.s-ok { background: var(--ok); }

/* Tabs */
.tabs { display: flex; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 6px; }
.tabs button { flex: 1; border: 0; background: none; padding: 8px 4px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); white-space: nowrap; }
.tabs { overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { flex: 1 1 0; min-width: 0; font-family: var(--display); font-size: 12.5px; letter-spacing: .02em; text-transform: uppercase; padding: 7px 2px; }
.tabs button span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: inset 0 -3px 0 var(--accent); }
.item-name, .entry-top b { letter-spacing: .01em; }
.btn { font-family: var(--display); font-size: 17px; letter-spacing: .06em; text-transform: uppercase; }

/* Schedule list */
.section-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 6px 0 -4px; font-weight: 600; }
.list { display: grid; gap: 8px; }
.item { text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 8px; }
/* Icons */
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic-tile { width: 42px; height: 42px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); color: var(--fg); flex: none; }
.ic-tile .ic { width: 23px; height: 23px; }
.ic-tile.s-over { color: var(--over); box-shadow: inset 0 0 0 1.5px var(--over); background: var(--surface); }
.ic-tile.s-soon { color: var(--soon); box-shadow: inset 0 0 0 1.5px var(--soon); background: var(--surface); }
.ic-tile.s-none, .ic-tile.s-todo, .ic-tile.s-unknown { color: var(--muted); }
.item-head { display: flex; gap: 12px; align-items: center; }
.item-head .item-name { flex: 1; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 4px; }
.pill .ic { width: 13px; height: 13px; stroke-width: 2.6; }
.chip .ic { width: 15px; height: 15px; stroke-width: 2.2; color: var(--muted); }
.chip.s-over .ic { color: var(--over); }
.chip.s-soon .ic { color: var(--soon); }
.chip.s-ok .ic { color: var(--ok); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn .ic { width: 18px; height: 18px; stroke-width: 2.1; }
.tabs button { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.tabs button .ic { width: 21px; height: 21px; }
.tabs button[aria-selected="true"] .ic { color: var(--accent); }
.planner summary h3 { display: inline-flex; align-items: center; gap: 8px; }
.planner summary h3 .ic { color: var(--accent); }
.item-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.item-name { font-weight: 650; font-size: 16px; min-width: 0; }
.item-group { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: block; font-weight: 500; }
.pill { flex: none; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 3px; white-space: nowrap; border: 1px solid currentColor; }
.pill.s-over { color: var(--over); }
.pill.s-soon { color: var(--soon); }
.pill.s-ok { color: var(--ok); }
.pill.s-none, .pill.s-todo { color: var(--none); }
.pill.s-done { color: var(--ok); }
.due { font-size: 14px; font-variant-numeric: tabular-nums; }
.due b { font-weight: 650; }
.sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--ok); }
.bar i.s-soon { background: var(--soon); }
.bar i.s-over { background: var(--over); }

/* History */
.entry { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 14px; display: grid; gap: 6px; text-align: left; width: 100%; }
.entry-top { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.entry-top b { font-family: var(--mono); font-weight: 700; }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); }
/* Spending */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: grid; gap: 2px; min-width: 0; align-content: start; }
.tile .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.tile .big { font-family: var(--mono); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.tile .sub { font-size: 12px; }
@media (max-width: 420px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tiles .tile:first-child { grid-column: 1 / -1; } }
#view > div > *, .sec, .sec > *, .panel > * { min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 12px; }
.panel h3 { margin: 0; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; flex: none; }
.svc { background: var(--c-service); }
.rep { background: var(--c-repair); }
.mix { background: repeating-linear-gradient(45deg, var(--muted) 0 2px, transparent 2px 5px); box-shadow: inset 0 0 0 1px var(--muted); }
.split { display: flex; gap: 8px 16px; flex-wrap: wrap; font-size: 14px; font-variant-numeric: tabular-nums; }
.split span { display: inline-flex; align-items: center; gap: 6px; }
.yr { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) auto; gap: 10px; align-items: center; font-variant-numeric: tabular-nums; font-size: 14px; }
.yr-label { color: var(--muted); }
.yr-bar { display: flex; gap: 2px; height: 14px; min-width: 6px; }
.yr-bar .seg { flex-basis: 0; min-width: 3px; height: 100%; }
.yr-bar .seg:first-child { border-radius: 4px 0 0 4px; }
.yr-bar .seg:last-child { border-radius: 0 4px 4px 0; }
.yr-bar .seg:only-child { border-radius: 4px; }
.yr-val { font-family: var(--mono); font-weight: 700; font-size: 13px; text-align: right; }
.sub.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* Planner, stock, attachments */
a { color: var(--accent); }
.seg { display: flex; gap: 4px; flex-wrap: wrap; }
.seg-btn { font-family: var(--display); font-weight: 600; font-size: 14px; letter-spacing: .04em; padding: 5px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.seg-btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.planner summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; gap: 6px 10px; flex-wrap: wrap; }
.planner summary::-webkit-details-marker { display: none; }
.planner summary h3::after { content: " \25BE"; color: var(--muted); }
.planner:not([open]) summary h3::after { content: " \25B8"; }
.planner-body { display: grid; gap: 10px; margin-top: 10px; }
.plan-h { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 4px 0 0; }
.plan-when { font-size: 15px; }
.plan-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.plan-list li { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; border-bottom: 1px solid var(--line); padding-bottom: 6px; font-variant-numeric: tabular-nums; }
.plan-list li:last-child { border-bottom: 0; padding-bottom: 0; }
.plan-list li > span:first-child { min-width: 0; }
.plan-list .pq { color: var(--muted); text-align: right; flex: none; max-width: 55%; }
.plan-list .short { color: var(--over); font-weight: 600; }
.use-rows { display: grid; gap: 6px; }
.use-row { display: grid; grid-template-columns: minmax(0, 1fr) 5em auto; gap: 6px; }
.use-row select, .use-row input { width: 100%; padding: 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; min-width: 0; }
.stepper { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; }
.stepper .btn { padding: 8px 14px; }
.atts { display: grid; gap: 6px; }
.att { display: flex; align-items: center; gap: 10px; padding: 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); min-width: 0; }
.att img { width: 44px; height: 44px; object-fit: cover; border-radius: 3px; flex: none; }
.att-ic { width: 44px; height: 44px; display: grid; place-items: center; flex: none; font-family: var(--display); font-weight: 700; font-size: 13px; letter-spacing: .06em; background: var(--surface-2); border-radius: 3px; color: var(--muted); }
.att .att-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att-x { border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); padding: 4px 8px; }
.visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); }
.file-btn { justify-self: start; cursor: pointer; }
.deduct { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; background: var(--surface-2); padding: 10px; border-radius: 4px; }
.deduct input { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin-top: 1px; }
.repairs { display: grid; gap: 2px; font-size: 14px; }
.repairs .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--soon); font-weight: 600; }
.repairs ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 6px; padding: 20px; color: var(--muted); text-align: center; }
.foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; }
.note { font-size: 13px; color: var(--muted); max-width: 65ch; }

/* Sheet */
.specs { display: grid; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.spec { display: grid; grid-template-columns: minmax(0, 7em) minmax(0, 1fr) auto; gap: 4px 10px; align-items: start; text-align: left; padding: 10px; border: 0; border-bottom: 1px solid var(--line); background: none; font-size: 14px; width: 100%; color: var(--fg); }
.spec:last-child { border-bottom: 0; }
.spec-k { font-weight: 600; color: var(--muted); font-size: 13px; }
.spec-v { display: grid; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.spec .pill { font-size: 11px; padding: 2px 7px; }
.tools { display: flex; flex-wrap: wrap; gap: 6px; }
.tools span { font-size: 13px; padding: 4px 9px; border-radius: 3px; background: var(--surface-2); }
.job-phase { display: grid; gap: 6px; margin-top: 8px; }
.phase-label { margin: 0; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; color: var(--fg); }
.step { display: flex; gap: 4px; align-items: flex-start; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 2px 4px 2px 2px; min-width: 0; }
.step.warn { border-left: 4px solid var(--soon); }
.sheet .step label { flex: 1; color: var(--fg); font-weight: 400; display: flex; gap: 12px; align-items: flex-start; padding: 10px 8px; font-size: 15px; line-height: 1.4; min-width: 0; }
.sheet .step label .ic { width: 16px; height: 16px; color: var(--soon); vertical-align: -3px; margin-right: 4px; stroke-width: 2.2; }
.sheet .step input { width: 24px; padding: 0; height: 24px; accent-color: var(--ok); flex: none; margin: 0; }
.sheet .step input:checked + span { color: var(--muted); }
.ts { flex: none; display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-variant-numeric: tabular-nums; font-weight: 600; padding: 11px 6px; text-decoration: none; }
.ts .ic { width: 13px; height: 13px; stroke-width: 2.2; }
.job-prog { display: grid; gap: 4px; position: sticky; top: -20px; background: var(--surface); padding: 6px 0; z-index: 1; }
.job-prog .bar i { width: 0; transition: width .2s; }
a.btn { text-decoration: none; color: var(--fg); }
.t-over { color: var(--over); }
.t-soon { color: var(--soon); }
.scrim { position: fixed; inset: 0; background: rgba(8,10,12,.62); -webkit-backdrop-filter: blur(6px) saturate(.7); backdrop-filter: blur(6px) saturate(.7); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 92%; overflow-y: auto; border-radius: 10px 10px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; }
@media (min-width: 600px) { .scrim { align-items: center; padding: 24px; } .sheet { border-radius: 10px; max-height: 100%; box-shadow: 0 24px 60px rgba(0,0,0,.35); border: 1px solid var(--line); } .sheet.sheet-job { max-width: 680px; height: 100%; } }
.sheet { overscroll-behavior: contain; }
body.sheet-open { overflow: hidden; }
.sheet h2 { margin: 0; font-family: var(--display); font-stretch: 80%; font-weight: 800; font-size: 22px; text-transform: uppercase; letter-spacing: .01em; }
.field { display: grid; gap: 5px; }
.field label, .field .lbl { font-size: 13px; font-weight: 600; color: var(--muted); }

.rw-head { display: flex; gap: 4px 10px; align-items: baseline; flex-wrap: wrap; }
.rw-head b { font-family: var(--display); font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.rw-node.s-over .rw-head b { color: var(--over); }
.rw-node.s-soon .rw-head b { color: var(--soon); }
.rw-chips { display: grid; gap: 6px; }
.rw-chip { display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font-size: 14px; min-width: 0; }
.rw-chip > span:first-of-type { font-weight: 600; min-width: 0; }
.rw-chip .ic { width: 17px; height: 17px; color: var(--muted); }
.rw-when { margin-left: auto; font-size: 12.5px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.rw-tip { margin: 0; display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
.rw-tip .ic { width: 14px; height: 14px; color: var(--accent); }

<script>
(function () {
  const DAY = 86400000;
  const state = { db: null, items: [], logs: [], odos: [], watch: [], stock: [], sample: null, sampleImages: null, renewals: [], meta: [], tyres: [], jobs: [], jobruns: [], valuations: [], downloads: null, assets: null, planKm: 5000, runKm: 30000, planOpen: false, loaded: { items: false, logs: false, odos: false, watch: false, stock: false, renewals: false, meta: false, tyres: false, jobs: false, jobruns: false, valuations: false }, tab: 'schedule', insView: (() => { try { return localStorage.getItem('prado-insview') || 'overview'; } catch (e) { return 'overview'; } })(), unavailable: false };
  try { const t = sessionStorage.getItem('prado-tab'); if (['schedule', 'history', 'spending', 'stock', 'watch'].includes(t)) state.tab = t; } catch (e) {}
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmtKm = (n) => Math.round(n).toLocaleString('en-AU');
  const todayISO = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const parseDate = (s) => s ? new Date(s + 'T00:00:00') : null;
  const fmtDate = (d) => d ? d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }) : 'date unknown';
  const fmtMonth = (d) => d.toLocaleDateString('en-AU', { month: 'short', year: 'numeric' });
  const startOfToday = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const daysBetween = (a, b) => Math.round((b - a) / DAY);
  const addMonths = (d, m) => { const r = new Date(d); const day = r.getDate(); r.setMonth(r.getMonth() + m); if (r.getDate() < day) r.setDate(0); return r; };
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

  function toast(msg) {
    const root = $('#toastRoot');
    root.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`;
    clearTimeout(toast.t); toast.t = setTimeout(() => { root.innerHTML = ''; }, 2600);
  }

  /* ---------- Core logic ---------- */

  // Current km: latest dated reading (odometer entries + services), plus an estimate from recent average driving.
  function currentKm() {
    const readings = [];
    state.odos.forEach(o => { if (o.km != null && o.date) readings.push({ km: +o.km, date: parseDate(o.date) }); });
    state.logs.forEach(l => { if (l.km != null && l.date) readings.push({ km: +l.km, date: parseDate(l.date) }); });
    const maxKmAny = Math.max(0, ...state.logs.map(l => +l.km || 0), ...state.odos.map(o => +o.km || 0));
    if (!readings.length) return maxKmAny ? { km: maxKmAny, base: { km: maxKmAny, date: null }, rate: null, estimated: false } : null;
    readings.sort((a, b) => a.date - b.date || a.km - b.km);
    const last = readings[readings.length - 1];
    const windowStart = new Date(last.date.getTime() - 365 * DAY);
    const recent = readings.filter(r => r.date >= windowStart);
    let rate = null;
    if (recent.length >= 2) {
      const first = recent[0]; const span = daysBetween(first.date, last.date);
      if (span >= 14 && last.km > first.km) rate = (last.km - first.km) / span;
    }
    const since = Math.max(0, daysBetween(last.date, startOfToday()));
    let km = Math.max(last.km, maxKmAny);
    let estimated = false;
    if (rate && since >= 1) { km = Math.round((last.km + rate * since) / 10) * 10; km = Math.max(km, maxKmAny); estimated = true; }
    return { km, base: last, rate, since, estimated };
  }

  function lastDone(itemId) {
    const hits = state.logs.filter(l => Array.isArray(l.itemIds) && l.itemIds.includes(itemId));
    hits.sort((a, b) => (+b.km || 0) - (+a.km || 0) || String(b.date || '').localeCompare(String(a.date || '')));
    return hits[0] || null;
  }

  function statusFor(item, cur) {
    const last = lastDone(item.id);
    if (item.kind === 'oneoff') return { state: last ? 'done' : 'todo', last };
    if (!last) return { state: 'none', last: null };
    const today = startOfToday();
    const r = { last, kmLeft: null, dueKm: null, daysLeft: null, dueDate: null, frac: 0, predicted: null };
    if (item.intervalKm && last.km != null && cur) {
      r.dueKm = +last.km + +item.intervalKm;
      r.kmLeft = r.dueKm - cur.km;
      r.frac = Math.max(r.frac, (cur.km - last.km) / item.intervalKm);
      if (cur.rate && r.kmLeft > 0) r.predicted = new Date(today.getTime() + (r.kmLeft / cur.rate) * DAY);
    }
    if (item.intervalMonths && last.date) {
      const ld = parseDate(last.date);
      r.dueDate = addMonths(ld, +item.intervalMonths);
      r.daysLeft = daysBetween(today, r.dueDate);
      const total = Math.max(1, daysBetween(ld, r.dueDate));
      r.frac = Math.max(r.frac, daysBetween(ld, today) / total);
    }
    const soonKm = item.intervalKm ? clamp(item.intervalKm * 0.1, 1000, 3000) : 0;
    if ((r.kmLeft != null && r.kmLeft < 0) || (r.daysLeft != null && r.daysLeft < 0)) r.state = 'over';
    else if ((r.kmLeft != null && r.kmLeft <= soonKm) || (r.daysLeft != null && r.daysLeft <= 30) || (r.predicted && daysBetween(today, r.predicted) <= 30)) r.state = 'soon';
    else r.state = 'ok';
    // Which limit comes first decides the headline.
    return r;
  }

  function intervalText(item) {
    if (item.kind === 'oneoff') return 'One-off job';
    const parts = [];
    if (item.intervalKm) parts.push(`every ${fmtKm(item.intervalKm)} km`);
    if (item.intervalMonths) parts.push(`${parts.length ? 'or ' : 'every '}${item.intervalMonths % 12 === 0 ? (item.intervalMonths / 12) + (item.intervalMonths === 12 ? ' year' : ' years') : item.intervalMonths + ' months'}`);
    return parts.join(' ') || 'No interval set';
  }

  function dueLine(s) {
    const span = (d) => d > 60 ? `${Math.round(d / 30.4)} months` : `${d} days`;
    const overKm = s.kmLeft != null && s.kmLeft < 0, overD = s.daysLeft != null && s.daysLeft < 0;
    if (overKm || overD) {
      const o = [];
      if (overKm) o.push(`<b>${fmtKm(-s.kmLeft)} km overdue</b>`);
      if (overD) o.push(`<b>${span(-s.daysLeft)} overdue</b>`);
      return o.join(' · ');
    }
    const bits = [];
    if (s.kmLeft != null) bits.push(s.kmLeft < 0 ? `<b>${fmtKm(-s.kmLeft)} km overdue</b>` : `Due in <b>${fmtKm(s.kmLeft)} km</b>`);
    if (s.daysLeft != null) {
      const d = s.daysLeft;
      const txt = d < 0 ? `${fmtKm(-d)} days overdue` : d < 60 ? `${d} days` : `${Math.round(d / 30.4)} months`;
      bits.push(bits.length ? (d < 0 ? `<b>${txt}</b>` : `or <b>${txt}</b>`) : (d < 0 ? `<b>${txt}</b>` : `Due in <b>${txt}</b>`));
    }
    return bits.join(' · ') || 'No interval set';
  }

  function subLine(s) {
    const bits = [];
    if (s.dueKm != null) bits.push(`at ${fmtKm(s.dueKm)} km`);
    if (s.dueDate) bits.push(`by ${fmtDate(s.dueDate)}`);
    if (s.predicted && (!s.dueDate || s.predicted < s.dueDate)) bits.push(`likely ~${fmtMonth(s.predicted)}`);
    return bits.join(' · ');
  }

  /* ---------- Rendering ---------- */

  function renderOdo(cur) {
    const odo = $('#odo');
    const digits = cur ? String(Math.round(cur.km)).padStart(6, '0') : '------';
    odo.innerHTML = digits.split('').map(d => `<span>${d}</span>`).join('') + '<span class="unit">km</span>';
    odo.setAttribute('aria-label', cur ? `${fmtKm(cur.km)} km` : 'No odometer reading yet');
    const meta = $('#odoMeta');
    if (state.unavailable) { meta.innerHTML = 'Saving isn’t available in this view. Open this page on claude.ai while signed in.'; return; }
    if (!allLoaded()) { meta.textContent = 'Loading…'; return; }
    if (!cur) { meta.innerHTML = '<strong>No reading yet.</strong><span>Tap “Update km” to add one.</span>'; return; }
    const lines = [];
    if (cur.estimated) lines.push(`<strong>Estimated today</strong>`);
    lines.push(`<span>Last reading ${fmtKm(cur.base.km)} km${cur.base.date ? ' · ' + fmtDate(cur.base.date) : ''}</span>`);
    if (cur.rate) lines.push(`<span>Averaging ${fmtKm(cur.rate * 7)} km a week</span>`);
    else lines.push(`<span>Add readings over a few weeks to estimate your weekly km</span>`);
    meta.innerHTML = lines.join('');
  }

  function allLoaded() { return state.loaded.items && state.loaded.logs && state.loaded.odos; }

  function render() {
    try { sessionStorage.setItem('prado-tab', state.tab); } catch (e) {} // a pull-to-refresh comes back to the same tab
    const cur = currentKm();
    renderOdo(cur);
    const view = $('#view');
    $('#tabSchedule').setAttribute('aria-selected', state.tab === 'schedule');
    $('#tabHistory').setAttribute('aria-selected', state.tab === 'history');
    $('#tabSpending').setAttribute('aria-selected', state.tab === 'spending');
    $('#tabStock').setAttribute('aria-selected', state.tab === 'stock');
    $('#tabWatch').setAttribute('aria-selected', state.tab === 'watch');
    const activeWatch = state.watch.filter(w => w.status !== 'resolved').length;
    $('#tabWatch span').textContent = activeWatch ? `Watch (${activeWatch})` : 'Watch';
    if (state.unavailable) { view.innerHTML = `<div class="empty">Your schedule is saved with this page on claude.ai. Open it there while signed in to see and update it.</div>`; $('#summary').innerHTML = ''; return; }
    if (!allLoaded()) { view.innerHTML = `<div class="empty">Loading your schedule…</div>`; return; }
    const recurring = state.items.filter(i => i.kind !== 'oneoff');
    const withStatus = recurring.map(i => ({ item: i, s: statusFor(i, cur) }));
    const counts = { over: 0, soon: 0, ok: 0, none: 0 };
    withStatus.forEach(x => counts[x.s.state]++);
    $('#summary').innerHTML = state.items.length ? [
      ['over', 'Overdue'], ['soon', 'Due soon'], ['ok', 'OK'], ['none', 'No record yet']
    ].filter(([k]) => counts[k] && k !== 'ok').map(([k, l]) => `<span class="chip s-${k}">${icon({ over: 'alert', soon: 'clock', ok: 'check', none: 'question' }[k])}${counts[k]} ${l}</span>`).join('') + (() => { const n = state.stock.filter(x => ['low', 'out'].includes(stockState(x))).length; return n ? `<span class="chip s-soon">${icon('box')}${n} stock low</span>` : ''; })() + extraChips() : '';
    view.innerHTML = state.tab === 'schedule' ? scheduleHTML(withStatus, cur)
      : state.tab === 'history' ? historyHTML()
      : state.tab === 'spending' ? insightsHTML(cur)
      : state.tab === 'stock' ? garageHTML(cur)
      : watchHTML(cur);
    const pl = view.querySelector('.planner');
    if (pl) pl.addEventListener('toggle', () => { state.planOpen = pl.open; });
    if (state.tab === 'spending') wireCompare(view);
  }

  function scheduleHTML(withStatus, cur) {
    if (!state.items.length) return `<div class="empty">No service items yet. Add your first one below.</div><div class="foot" style="margin-top:12px"><span></span><button class="btn" type="button" data-act="add-item">${icon('plus')}Add item</button></div>`;
    const rate = (cur && cur.rate) || 40;
    const soonness = (s) => Math.min(s.kmLeft != null ? s.kmLeft / rate : Infinity, s.daysLeft != null ? s.daysLeft : Infinity);
    const byUrgency = (a, b) => soonness(a.s) - soonness(b.s) || (a.item.order || 0) - (b.item.order || 0);
    const pillTxt = { over: 'Overdue', soon: 'Due soon' };

    // Due soon or overdue: full cards.
    const attention = withStatus.filter(x => x.s.state === 'over' || x.s.state === 'soon').sort(byUrgency);
    const cards = attention.map(({ item, s }) => `<button class="item" type="button" data-act="open-item" data-id="${esc(item.id)}">
        <div class="item-head"><span class="ic-tile s-${s.state}">${icon(iconFor(item))}</span><div class="item-name">${esc(item.name)}</div><span class="pill s-${s.state}">${statusIcon(s.state)}${pillTxt[s.state]}</span></div>
        <div class="due">${dueLine(s)}</div>
        <div class="bar"><i class="s-${s.state}" style="width:${clamp((s.frac || 0) * 100, 2, 100).toFixed(1)}%"></i></div>
        <div class="sub">${subLine(s)}${subLine(s) ? '<br>' : ''}Last done ${s.last.km != null ? fmtKm(s.last.km) + ' km' : ''}${s.last.date ? ' · ' + fmtDate(parseDate(s.last.date)) : ''}</div></button>`).join('');

    // On track: one line each, km to go on the right (time only for items with no km interval), thin bar underneath.
    const closest = (s) => {
      if (s.kmLeft != null) return `in <b>${fmtKm(s.kmLeft)} km</b>`;
      const d = s.daysLeft; return d == null ? '' : `in <b>${d > 60 ? Math.round(d / 30.4) + ' months' : d + ' days'}</b>`;
    };
    const row = (item, st, val, frac) => `<button class="row" type="button" data-act="open-item" data-id="${esc(item.id)}">
        <span class="ic-tile sm s-${st}">${icon(iconFor(item))}</span><span class="row-name">${esc(item.name)}</span><span class="row-val">${val}</span>
        ${frac != null ? `<span class="row-bar"><i style="width:${clamp(frac * 100, 2, 100).toFixed(1)}%"></i></span>` : ''}</button>`;
    // Order by km to go, and fill each bar on one shared scale (full = due, empty = 30,000 km or more away),
    // so longer bars always mean sooner. Time-only items are converted to km at the usual driving rate.
    const kmToGo = (s) => s.kmLeft != null ? s.kmLeft : (s.daysLeft != null ? s.daysLeft * rate : Infinity);
    const ok = withStatus.filter(x => x.s.state === 'ok').sort((a, b) => kmToGo(a.s) - kmToGo(b.s) || (a.item.order || 0) - (b.item.order || 0));
    const okHTML = ok.map(({ item, s }) => row(item, 'ok', closest(s), clamp(1 - kmToGo(s) / 30000, 0.03, 1))).join('');

    // No record yet.
    const none = withStatus.filter(x => x.s.state === 'none').sort((a, b) => (a.item.order || 0) - (b.item.order || 0));
    const noneHTML = none.map(({ item }) => row(item, 'none', `<span class="row-hint">${esc(intervalText(item).replace(/^every /, ''))}</span>`, null)).join('');

    // One-off jobs.
    const oneoffs = state.items.filter(i => i.kind === 'oneoff').sort((a, b) => (a.order || 0) - (b.order || 0));
    const oneHTML = oneoffs.map(item => {
      const s = statusFor(item, cur);
      const val = s.last ? `${statusIcon('done')}Done${s.last.km != null ? ' ' + fmtKm(s.last.km) + ' km' : ''}` : 'Not done';
      return row(item, s.state, `<span class="row-done">${val}</span>`, null);
    }).join('');

    const section = (label, count, inner, cls = 'rows') => inner ? `<div class="sec"><p class="section-label">${label}${count != null ? ` <span class="sec-count">${count}</span>` : ''}</p><div class="${cls}">${inner}</div></div>` : '';
    return `<div style="display:grid;gap:14px">${nextUpHTML(withStatus, cur)}${plannerHTML(withStatus, cur)}
      ${section('Needs attention', attention.length, cards, 'list')}
      ${renewalsHTML()}
      ${tyresHTML(cur)}
      ${section('On track', ok.length, okHTML)}
      ${section('Needs history', none.length, noneHTML)}
      ${section('One-off jobs', null, oneHTML)}
      <div class="foot"><p class="note">Tap any item for its history and details. Items are due at whichever limit comes first, km or time. “Due soon” means within 10% of the km interval (1,000–3,000 km), within 30 days, or about a month away at your usual driving.</p><button class="btn" type="button" data-act="add-item">${icon('plus')}Add item</button></div></div>`;
  }

  function historyHTML() {
    const name = (id) => (state.items.find(i => i.id === id) || {}).name || id;
    const logs = state.logs.slice().sort((a, b) => (+b.km || 0) - (+a.km || 0) || String(b.date || '').localeCompare(String(a.date || '')));
    const odos = state.odos.slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')) || (+b.km || 0) - (+a.km || 0));
    const logHTML = logs.length ? logs.map(l => `<button class="entry" type="button" data-act="edit-log" data-id="${esc(l._id)}">
        <div class="entry-top"><b>${l.km != null ? fmtKm(l.km) + ' km' : 'km unknown'}</b><span class="sub">${fmtDate(parseDate(l.date))}</span></div>
        ${(l.itemIds || []).length ? `<div class="tags">${l.itemIds.map(id => `<span class="tag">${esc(name(id))}</span>`).join('')}</div>` : ''}
        ${(l.repairs || []).length ? `<div class="repairs"><span class="lbl">Repairs and other work</span><ul>${l.repairs.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
        ${(l.attachments || []).length ? `<div class="tags"><span class="tag" style="display:inline-flex;align-items:center;gap:4px">${icon('doc')}${l.attachments.length} ${l.attachments.length === 1 ? 'invoice or photo' : 'invoices or photos'}</span></div>` : ''}
        ${l.where || l.cost || l.notes ? `<div class="sub">${[l.where, l.cost ? '$' + Number(l.cost).toLocaleString('en-AU', { minimumFractionDigits: 0, maximumFractionDigits: 2 }) : '', l.notes].filter(Boolean).map(esc).join(' · ')}</div>` : ''}
      </button>`).join('') : `<div class="empty">No services logged yet. Use “Log a service” to add past work from your logbook.</div>`;
    const odoHTML = odos.length ? odos.map(o => `<button class="entry" type="button" data-act="edit-odo" data-id="${esc(o._id)}">
        <div class="entry-top"><b>${fmtKm(o.km)} km</b><span class="sub">${fmtDate(parseDate(o.date))}</span></div>${o.note ? `<div class="sub">${esc(o.note)}</div>` : ''}</button>`).join('') : `<div class="empty">No odometer readings yet.</div>`;
    return `<div style="display:grid;gap:12px"><p class="section-label">Services</p><div class="list">${logHTML}</div>
      <p class="section-label">Odometer readings</p><div class="list">${odoHTML}</div>${reportHTML()}${backupHTML()}</div>`;
  }

  /* ---------- Icons ---------- */

  const icon = (name) => `<svg class="ic" aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const ICON_BY_ID = { 'engine-oil': 'oil', 'oil-filter': 'filter', grease: 'joint', 'cabin-filter': 'fan', 'air-filter': 'air', 'fuel-filter': 'fuel',
    'diff-oils': 'gear', 'brake-fluid': 'brake', 'transfer-case': 'gear', atf: 'gear', 'timing-belt': 'belt', coolant: 'coolant', egr: 'egr' };
  function iconFor(item) {
    if (!item) return 'wrench';
    if (ICON_BY_ID[item.id]) return ICON_BY_ID[item.id];
    const n = String(item.name || '').toLowerCase();
    const rules = [[/tyre|tire|wheel|alignment/, 'tyre'], [/brake|pad|rotor/, 'brake'], [/coolant|radiator|thermostat/, 'coolant'], [/belt/, 'belt'],
      [/fuel|diesel|injector/, 'fuel'], [/air/, 'air'], [/cabin|a\/c|aircon/, 'fan'], [/filter/, 'filter'], [/oil/, 'oil'], [/diff|gear|trans|clutch/, 'gear'], [/grease|joint|shaft/, 'joint'], [/egr/, 'egr']];
    for (const [re, ic] of rules) if (re.test(n)) return ic;
    return ({ Engine: 'wrench', Driveline: 'gear', Brakes: 'brake', Cabin: 'fan' })[item.group] || 'wrench';
  }
  function stockIcon(x) {
    const u = (x.uses || [])[0];
    if (u) return iconFor(state.items.find(i => i.id === u.itemId) || { name: x.name });
    return iconFor({ name: x.name }) === 'wrench' ? 'box' : iconFor({ name: x.name });
  }
  const statusIcon = (st) => { const m = { over: 'alert', soon: 'clock', ok: 'check', done: 'check' }[st]; return m ? icon(m) : ''; };

  /* ---------- Renewals (rego, insurance, inspections) ---------- */

  const isoDate = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const spanText = (d) => d > 60 ? `${Math.round(d / 30.4)} months` : `${d} ${d === 1 ? 'day' : 'days'}`;
  const RENEW_ICON = { rego: 'calendar', inspection: 'clipboard', ctp: 'shield', insurance: 'shield', roadside: 'phone', other: 'calendar' };
  function renewalStatus(r) {
    if (!r.dueDate) return { state: 'none', daysLeft: null };
    const daysLeft = daysBetween(startOfToday(), parseDate(r.dueDate));
    const lead = isBlank(r.remindDays) ? 30 : +r.remindDays;
    return { state: daysLeft < 0 ? 'over' : daysLeft <= lead ? 'soon' : 'ok', daysLeft };
  }
  const renewWhen = (st) => st.daysLeft == null ? '' : st.daysLeft < 0 ? `${spanText(-st.daysLeft)} overdue` : st.daysLeft === 0 ? 'due today' : `in ${spanText(st.daysLeft)}`;

  function renewalsHTML() {
    if (!state.loaded.renewals) return '';
    const rank = { over: 0, soon: 1, ok: 2, none: 3 };
    const list = state.renewals.map(r => ({ r, st: renewalStatus(r) }))
      .sort((a, b) => rank[a.st.state] - rank[b.st.state] || (a.st.daysLeft ?? 1e9) - (b.st.daysLeft ?? 1e9) || String(a.r.name).localeCompare(String(b.r.name)));
    const rows = list.map(({ r, st }) => `<button class="row" type="button" data-act="open-renewal" data-id="${esc(r._id)}">
        <span class="ic-tile sm s-${st.state}">${icon(RENEW_ICON[r.kind] || 'calendar')}</span><span class="row-name">${esc(r.name)}</span>
        <span class="row-val${st.state === 'over' ? ' r-over' : st.state === 'soon' ? ' r-soon' : ''}">${st.state === 'none' ? '<span class="row-hint">Set date</span>' : `<b>${renewWhen(st)}</b>`}</span></button>`).join('');
    return `<div class="sec"><p class="section-label">Renewals</p>
      <div class="rows">${rows || '<div class="row" style="cursor:default"><span class="row-hint">Add rego, insurance and other renewals.</span></div>'}</div>
      <button class="btn ghost file-btn" type="button" data-act="add-renewal">${icon('plus')}Add renewal</button></div>`;
  }

  function renewalSheet(r) {
    const isNew = !r;
    r = r || { name: '', kind: 'other', dueDate: null, remindDays: 30, provider: '', cost: null, notes: '', lastRenewed: null };
    const kinds = [['rego', 'Registration'], ['inspection', 'Safety inspection (pink slip)'], ['ctp', 'CTP green slip'], ['insurance', 'Insurance'], ['roadside', 'Roadside assistance'], ['other', 'Other']];
    openSheet(`<h2>${isNew ? 'Add renewal' : esc(r.name)}</h2>
      ${r.notes && !isNew ? `<p class="note" style="margin:0">${esc(r.notes)}</p>` : ''}
      <div class="field"><label for="r-name">Name</label><input id="r-name" value="${esc(r.name)}" placeholder="e.g. Registration"></div>
      <div class="row2">
        <div class="field"><label for="r-kind">Type</label><select id="r-kind">${kinds.map(([k, l]) => `<option value="${k}" ${r.kind === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
        <div class="field"><label for="r-due">Due date</label><input id="r-due" type="date" value="${esc(r.dueDate || '')}"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="r-lead">Remind me (days before)</label><input id="r-lead" inputmode="numeric" value="${isBlank(r.remindDays) ? 30 : esc(r.remindDays)}"></div>
        <div class="field"><label for="r-cost">Yearly cost $</label><input id="r-cost" inputmode="decimal" value="${isBlank(r.cost) ? '' : esc(r.cost)}"></div>
      </div>
      <div class="field"><label for="r-prov">Provider or policy number</label><input id="r-prov" value="${esc(r.provider || '')}" placeholder="e.g. Service NSW, NRMA policy 123"></div>
      <div class="field"><label for="r-notes">Notes</label><textarea id="r-notes" rows="2">${esc(r.notes || '')}</textarea></div>
      ${r.lastRenewed ? `<p class="sub" style="margin:0">Last renewed ${fmtDate(parseDate(r.lastRenewed))}</p>` : ''}
      <div id="confirmBox"></div>
      <div class="sheet-actions">${isNew ? '' : `<button class="btn danger ghost" type="button" data-act="ask-del">Delete</button><button class="btn ghost" type="button" id="r-renew">${icon('check')}Mark renewed</button><span class="spacer"></span>`}
        <button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="r-save">Save</button></div>`,
      (sheet) => {
        const num = (v) => { const t = String(v).replace(/[^0-9.]/g, ''); return t === '' ? null : Number(t); };
        const collect = () => {
          const name = $('#r-name', sheet).value.trim();
          if (!name) { toast('Give it a name.'); return null; }
          const lead = num($('#r-lead', sheet).value);
          return { name, kind: $('#r-kind', sheet).value, dueDate: $('#r-due', sheet).value || null, remindDays: lead == null ? 30 : lead,
            provider: $('#r-prov', sheet).value.trim(), cost: num($('#r-cost', sheet).value), notes: $('#r-notes', sheet).value.trim(), lastRenewed: r.lastRenewed || null };
        };
        $('#r-save', sheet).onclick = async () => { const d = collect(); if (!d) return; await write(() => isNew ? state.db.collection('renewals').add(d) : state.db.collection('renewals').doc(r._id).set(d), isNew ? 'Renewal added' : 'Saved'); };
        const rn = $('#r-renew', sheet);
        if (rn) rn.onclick = async () => {
          const d = collect(); if (!d) return;
          const next = addMonths(d.dueDate ? parseDate(d.dueDate) : startOfToday(), 12);
          d.dueDate = isoDate(next); d.lastRenewed = todayISO();
          await write(() => state.db.collection('renewals').doc(r._id).set(d), `Renewed. Next due ${fmtDate(next)}`);
        };
        if (!isNew) wireDelete(sheet, `“${r.name}”`, () => state.db.collection('renewals').doc(r._id).delete());
      });
  }

  /* ---------- Backup ---------- */

  function lastBackup() { const m = state.meta.find(x => x._id === 'backup'); return m && m.date ? parseDate(m.date) : null; }
  function backupDue() { const d = lastBackup(); return !d || daysBetween(d, startOfToday()) > 30; }
  function backupHTML() {
    const d = lastBackup();
    return `<div class="panel" id="backupPanel"><h3 class="panel-title">${icon('download')}Back up your data</h3>
      <p class="sub" style="margin:0">${d ? `Last backup ${fmtDate(d)}.${backupDue() ? ' Time for another.' : ''}` : 'Not backed up yet.'} Saves a copy of everything to your phone or computer, in case anything happens to the app.</p>
      <div class="actions backup-actions"><button class="btn primary" type="button" data-act="backup-json">${icon('download')}Full backup</button><button class="btn" type="button" data-act="backup-csv">${icon('doc')}Spreadsheet</button></div>
      <p class="note" style="margin:0">Full backup (.json) holds every record, and Claude can restore from it. Spreadsheet (.csv) is your service history for Excel or Numbers. Invoice files stay in the app and are listed in the backup.</p></div>`;
  }
  const strip = (arr) => arr.map(({ _id, ...rest }) => ({ id: _id, ...rest }));
  async function doBackup(kind) {
    if (!state.downloads) return toast('Saving files isn’t available in this view. Open the app on claude.ai.');
    const stamp = todayISO();
    let filename, data;
    if (kind === 'json') {
      filename = `prado-backup-${stamp}.json`;
      data = JSON.stringify({ app: 'Prado Service Tracker', exportedAt: new Date().toISOString(), items: strip(state.items), log: strip(state.logs), odo: strip(state.odos), watch: strip(state.watch), stock: strip(state.stock), renewals: strip(state.renewals), tyres: strip(state.tyres) }, null, 2);
    } else {
      filename = `prado-service-history-${stamp}.csv`;
      const q = (v) => { const t = v == null ? '' : String(v); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
      const rows = [['Date', 'Km', 'Schedule items', 'Repairs and other work', 'Done by', 'Cost', 'Repairs portion', 'Notes', 'Attachments']];
      state.logs.slice().sort((a, b) => (+a.km || 0) - (+b.km || 0) || String(a.date || '').localeCompare(String(b.date || '')))
        .forEach(l => rows.push([l.date || '', l.km ?? '', (l.itemIds || []).map(itemName).join('; '), (l.repairs || []).join('; '), l.where || '', l.cost ?? '', l.repairCost ?? '', l.notes || '', (l.attachments || []).map(a => a.name).join('; ')]));
      data = '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n');
    }
    try {
      await state.downloads.save({ filename, data });
      if (kind === 'json' && state.db) { try { await state.db.collection('meta').doc('backup').set({ date: todayISO() }); } catch (e) {} }
      toast(kind === 'json' ? 'Backup saved' : 'Spreadsheet saved');
    } catch (e) {
      const c = e && e.code;
      if (c === 'declined') return;
      toast(c === 'rate_limited' ? 'A save is already open. Try again in a moment.' : 'Couldn’t save the file in this view.');
    }
  }

  // Extra summary chips: renewals coming up and a backup nudge.
  function extraChips() {
    const ren = state.renewals.map(r => ({ r, st: renewalStatus(r) })).filter(x => x.st.state === 'over' || x.st.state === 'soon')
      .map(({ r, st }) => `<span class="chip s-${st.state}">${icon(RENEW_ICON[r.kind] || 'calendar')}${esc(r.name)} ${renewWhen(st)}</span>`).join('');
    const bk = state.loaded.meta && state.logs.length && backupDue() ? `<button type="button" class="chip chip-btn" data-act="go-backup">${icon('download')}Backup due</button>` : '';
    return ren + bk;
  }

  /* ---------- Tyres ---------- */

  const CORNERS = [['fl', 'Front left'], ['fr', 'Front right'], ['rl', 'Rear left'], ['rr', 'Rear right']];
  const depthsOf = (r) => r ? CORNERS.map(([k]) => +r[k]).filter(n => n > 0) : [];

  // Wear rate from new tread (or the first reading) to the latest reading, projected to the replace-at depth.
  function tyreStats(t, cur) {
    const rs = (t.readings || []).filter(r => depthsOf(r).length).slice().sort((a, b) => (+a.km || 0) - (+b.km || 0) || String(a.date || '').localeCompare(String(b.date || '')));
    const last = rs[rs.length - 1] || null;
    const min = last ? Math.min(...depthsOf(last)) : null;
    const floor = isBlank(t.minTread) ? 3 : +t.minTread;
    let start = null;
    if (!isBlank(t.startTread) && !isBlank(t.fittedKm)) start = { km: +t.fittedKm, d: +t.startTread };
    else if (rs.length >= 2) start = { km: +rs[0].km, d: Math.min(...depthsOf(rs[0])) };
    let kmLeft = null, predicted = null, per10k = null;
    if (start && last && min != null && +last.km > start.km && start.d > min) {
      const rate = (start.d - min) / (+last.km - start.km);
      per10k = rate * 10000;
      const since = cur ? Math.max(0, cur.km - +last.km) : 0;
      kmLeft = Math.max(0, (min - floor) / rate - since);
      if (cur && cur.rate) predicted = new Date(startOfToday().getTime() + (kmLeft / cur.rate) * DAY);
    }
    const usedKm = !isBlank(t.fittedKm) && cur ? Math.max(0, cur.km - +t.fittedKm) : null;
    const treadState = min == null ? 'none' : min <= floor ? 'over' : ((kmLeft != null && kmLeft <= 5000) || min <= floor + 1) ? 'soon' : 'ok';
    // Share of usable tread left (new depth down to the replace-at depth).
    const newD = !isBlank(t.startTread) ? +t.startTread : (start ? start.d : null);
    const treadPct = min != null && newD > floor ? clamp((min - floor) / (newD - floor), 0, 1) : null;
    // Age from the DOT date code, against a replace-by age (6 years unless set).
    const maxAge = isBlank(t.maxAge) ? 6 : +t.maxAge;
    const made = t.madeDate ? parseDate(t.madeDate) : null;
    let ageYrs = null, ageLeft = null, ageDue = null, ageState = 'none';
    if (made) {
      ageYrs = Math.max(0, (startOfToday() - made) / (365.25 * DAY));
      ageLeft = maxAge - ageYrs;
      ageDue = new Date(made); ageDue.setFullYear(ageDue.getFullYear() + maxAge);
      ageState = ageLeft <= 0 ? 'over' : ageLeft <= 1 ? 'soon' : 'ok';
    }
    const first = ageDue && predicted ? (ageDue < predicted ? 'age' : 'tread') : null;
    const rank = { none: 0, ok: 1, soon: 2, over: 3 };
    const st = rank[ageState] > rank[treadState] ? ageState : treadState;
    return { last, min, floor, kmLeft, predicted, per10k, usedKm, treadPct, treadState, maxAge, ageYrs, ageLeft, ageDue, ageState, first, state: st };
  }
  // DOT date code (week + 2-digit year, e.g. 3522) <-> the Monday of that ISO week.
  function dotToISO(code) {
    const m = String(code || '').replace(/\D/g, '').match(/^(\d{2})(\d{2})$/);
    if (!m) return null;
    const wk = +m[1], yr = 2000 + +m[2];
    if (wk < 1 || wk > 53) return null;
    const jan4 = new Date(yr, 0, 4);
    const d = new Date(yr, 0, 4 - ((jan4.getDay() + 6) % 7) + (wk - 1) * 7);
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }
  function isoToDot(iso) {
    const d = parseDate(iso); if (!d) return '';
    const th = new Date(d); th.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7));
    const wk1 = new Date(th.getFullYear(), 0, 4);
    const wk = 1 + Math.round(((th - wk1) / DAY - 3 + ((wk1.getDay() + 6) % 7)) / 7);
    return String(wk).padStart(2, '0') + String(th.getFullYear() % 100).padStart(2, '0');
  }
  const yrsFmt = (y) => y >= 1 ? `${qtyFmt(y)} yrs` : `${Math.max(0, Math.round(y * 12))} months`;
  const depthClass = (d, floor) => !(d > 0) ? '' : d <= floor ? 't-over' : d <= floor + 1.5 ? 't-soon' : 't-ok';

  function tyresHTML(cur) {
    if (!state.loaded.tyres) return '';
    const active = state.tyres.filter(t => t.active !== false);
    const card = (t) => {
      const ts = tyreStats(t, cur);
      const map = `<span class="tread-map" aria-hidden="true">${CORNERS.map(([k]) => { const d = ts.last ? +ts.last[k] : null; return `<span class="${depthClass(d, ts.floor)}">${d > 0 ? qtyFmt(d) : '–'}</span>`; }).join('')}</span>`;
      const line1 = [t.size, t.fittedKm != null && !isBlank(t.fittedKm) ? `fitted at ${fmtKm(t.fittedKm)} km` : ''].filter(Boolean).join(' · ');
      const line2 = ts.min == null ? 'Add a tread reading to see how long they’ll last'
        : `Lowest tread <b>${qtyFmt(ts.min)} mm</b>${!isBlank(t.startTread) ? ` of ${qtyFmt(t.startTread)} mm new` : ''}`;
      const line3 = ts.kmLeft != null ? `About <b>${fmtKm(Math.round(ts.kmLeft / 500) * 500)} km</b> left${ts.predicted ? `, around ${fmtMonth(ts.predicted)}` : ''}` : (ts.min != null ? 'Add a second reading later to predict replacement' : '');
      // Two "remaining" meters: usable tread and age. Text carries the numbers; colour only backs it up.
      const flag = (s) => s === 'over' ? ' · <b class="t-over">replace now</b>' : s === 'soon' ? ' · <b class="t-soon">due soon</b>' : '';
      const meter = (label, value, detail, pct, s) => `<span class="tm"><span class="tm-top"><span><b>${label}</b> ${value}${flag(s)}</span><span class="sub">${detail}</span></span><span class="bar" role="img" aria-label="${label} ${Math.round(pct * 100)}% remaining"><i class="s-${s}" style="width:${Math.max(2, Math.round(pct * 100))}%"></i></span></span>`;
      const meters = [];
      if (ts.treadPct != null) meters.push(meter('Tread', `${Math.round(ts.treadPct * 100)}% left`,
        ts.kmLeft != null ? `about ${fmtKm(Math.round(ts.kmLeft / 500) * 500)} km${ts.predicted ? ` · ${fmtMonth(ts.predicted)}` : ''}` : `${qtyFmt(ts.min)} mm, replace at ${qtyFmt(ts.floor)} mm`, ts.treadPct, ts.treadState));
      if (ts.ageYrs != null) meters.push(meter('Age', ts.ageLeft > 0 ? `${yrsFmt(ts.ageLeft)} left` : 'past limit',
        `made ${fmtMonth(parseDate(t.madeDate))} · replace by ${fmtMonth(ts.ageDue)}`, clamp(ts.ageLeft / ts.maxAge, 0, 1), ts.ageState));
      const decide = ts.first === 'age' ? `Age will likely decide first: plan new tyres around <b>${fmtMonth(ts.ageDue)}</b>.`
        : ts.first === 'tread' ? `Tread will likely wear out first, around <b>${fmtMonth(ts.predicted)}</b>.` : '';
      const showLines = ts.treadPct == null;
      return `<button class="tyre-card" type="button" data-act="open-tyre" data-id="${esc(t._id)}">
        <span class="ic-tile s-${ts.state}">${icon('tyre')}</span>
        <span class="tyre-info"><span class="row-name">${esc(t.name || 'Tyres')}</span>${line1 ? `<span class="sub">${esc(line1)}</span>` : ''}${showLines ? `<span class="sub">${line2}</span>${line3 ? `<span class="sub">${line3}</span>` : ''}` : `<span class="sub">Lowest tread <b>${qtyFmt(ts.min)} mm</b></span>`}</span>
        ${map}${meters.length ? `<span class="tyre-meters">${meters.join('')}${decide ? `<span class="sub tm-decide">${decide}</span>` : ''}</span>` : ''}</button>`;
    };
    return `<div class="sec"><p class="section-label">Tyres</p>
      ${active.length ? active.map(card).join('') : `<button class="tyre-card" type="button" data-act="add-tyre"><span class="ic-tile s-none">${icon('tyre')}</span><span class="tyre-info"><span class="row-name">Add your tyres</span><span class="sub">Brand, size, when fitted and tread depth</span></span><span></span></button>`}</div>`;
  }

  function tyreSheet(t, prefill) {
    const isNew = !t;
    const cur = currentKm();
    t = t || Object.assign({ name: '', size: '', fittedDate: todayISO(), fittedKm: cur ? Math.round(cur.km) : null, startTread: null, minTread: 3, cost: null, notes: '', active: true, readings: [] }, prefill || {});
    const ts = tyreStats(t, cur);
    const rs = (t.readings || []).slice().sort((a, b) => (+b.km || 0) - (+a.km || 0));
    openSheet(`<h2>${isNew ? 'Add tyres' : esc(t.name || 'Tyres')}</h2>
      <div class="row2">
        <div class="field"><label for="ty-name">Brand and model</label><input id="ty-name" value="${esc(t.name || '')}" placeholder="e.g. BFGoodrich KO2"></div>
        <div class="field"><label for="ty-size">Size</label><input id="ty-size" value="${esc(t.size || '')}" placeholder="e.g. 265/65R17"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="ty-fdate">Fitted on</label><input id="ty-fdate" type="date" value="${esc(t.fittedDate || '')}"></div>
        <div class="field"><label for="ty-fkm">Fitted at (km)</label><input id="ty-fkm" inputmode="numeric" value="${isBlank(t.fittedKm) ? '' : esc(t.fittedKm)}"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="ty-start">Tread when new (mm)</label><input id="ty-start" inputmode="decimal" value="${isBlank(t.startTread) ? '' : esc(t.startTread)}" placeholder="Often 12–15 mm for all-terrains"></div>
        <div class="field"><label for="ty-min">Replace at (mm)</label><input id="ty-min" inputmode="decimal" value="${isBlank(t.minTread) ? 3 : esc(t.minTread)}"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="ty-dot">DOT date code</label><input id="ty-dot" inputmode="numeric" maxlength="4" value="${esc(t.dot || isoToDot(t.madeDate))}" placeholder="Last 4 digits, e.g. 3522"><span class="sub" id="ty-dot-hint"></span></div>
        <div class="field"><label for="ty-maxage">Replace by age (years)</label><input id="ty-maxage" inputmode="numeric" value="${isBlank(t.maxAge) ? 6 : esc(t.maxAge)}"></div>
      </div>
      <div class="field"><span class="lbl">Add a tread reading (mm, lowest point on each tyre)</span>
        <div class="tread-inputs">${CORNERS.map(([k, l]) => `<label class="ti"><span>${l}</span><input id="ty-${k}" inputmode="decimal" placeholder="mm"></label>`).join('')}</div>
        <span class="sub">Saved with today’s date at ${cur ? fmtKm(Math.round(cur.km)) + ' km' : 'the current km'}.</span></div>
      ${rs.length ? `<div class="field"><span class="lbl">Readings</span><div class="hist-mini">${rs.map(r => `<div><span>${CORNERS.map(([k]) => r[k] > 0 ? qtyFmt(r[k]) : '–').join(' / ')} mm</span><span class="sub">${r.km != null ? fmtKm(r.km) + ' km · ' : ''}${fmtDate(parseDate(r.date))}</span></div>`).join('')}</div><span class="sub">Order: front left / front right / rear left / rear right${ts.per10k ? ` · wearing about ${qtyFmt(ts.per10k)} mm per 10,000 km` : ''}</span></div>` : ''}
      <div class="row2">
        <div class="field"><label for="ty-cost">Cost of the set $</label><input id="ty-cost" inputmode="decimal" value="${isBlank(t.cost) ? '' : esc(t.cost)}"></div>
        <div class="field"><label for="ty-notes">Notes</label><input id="ty-notes" value="${esc(t.notes || '')}" placeholder="Pressures, where bought, warranty"></div>
      </div>
      <p class="note" style="margin:0">The legal minimum in Australia is 1.5 mm. Many 4WD owners replace at about 3 mm for grip in the wet and off-road.</p>
      <div id="confirmBox"></div>
      <div class="sheet-actions">${isNew ? '' : `<button class="btn danger ghost" type="button" data-act="ask-del">Delete</button><button class="btn ghost" type="button" id="ty-replace">New set fitted</button><span class="spacer"></span>`}
        <button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="ty-save">Save</button></div>`,
      (sheet) => {
        const num = (v) => { const x = String(v).replace(/[^0-9.]/g, ''); return x === '' ? null : Number(x); };
        const collect = () => {
          const readings = (t.readings || []).slice();
          const r = { date: todayISO(), km: cur ? Math.round(cur.km) : null };
          let any = false;
          CORNERS.forEach(([k]) => { const v = num($('#ty-' + k, sheet).value); if (v != null) { r[k] = v; any = true; } });
          if (any) readings.push(r);
          const base = Object.assign({}, t); delete base._id; // keep any fields this form doesn't show
          const dot = $('#ty-dot', sheet).value.replace(/\D/g, '');
          return Object.assign(base, { name: $('#ty-name', sheet).value.trim(), size: $('#ty-size', sheet).value.trim(), fittedDate: $('#ty-fdate', sheet).value || null,
            fittedKm: num($('#ty-fkm', sheet).value), startTread: num($('#ty-start', sheet).value), minTread: num($('#ty-min', sheet).value) ?? 3,
            dot: dot || null, madeDate: dotToISO(dot), maxAge: num($('#ty-maxage', sheet).value) ?? 6,
            cost: num($('#ty-cost', sheet).value), notes: $('#ty-notes', sheet).value.trim(), active: t.active !== false, readings });
        };
        const dotIn = $('#ty-dot', sheet), dotHint = $('#ty-dot-hint', sheet);
        const showDot = () => {
          const v = dotIn.value.replace(/\D/g, ''), iso = dotToISO(v);
          dotHint.textContent = !v ? 'On the tyre wall after “DOT”, in an oval' : iso ? `Made week ${+v.slice(0, 2)}, ${fmtMonth(parseDate(iso))}` : 'Use 4 digits: week then year';
        };
        dotIn.addEventListener('input', showDot); showDot();
        $('#ty-save', sheet).onclick = async () => { const d = collect(); await write(() => isNew ? state.db.collection('tyres').add(d) : state.db.collection('tyres').doc(t._id).set(d), isNew ? 'Tyres added' : 'Tyres saved'); };
        const rp = $('#ty-replace', sheet);
        if (rp) rp.onclick = async () => {
          const d = collect(); d.active = false; d.removedDate = todayISO(); d.removedKm = cur ? Math.round(cur.km) : null;
          await write(() => state.db.collection('tyres').doc(t._id).set(d), 'Old set archived');
          tyreSheet(null, { name: d.name, size: d.size, startTread: d.startTread, minTread: d.minTread });
        };
        if (!isNew) wireDelete(sheet, 'this tyre set and its readings', () => state.db.collection('tyres').doc(t._id).delete());
      });
  }

  /* ---------- Service history report (PDF) ---------- */

  function loadScript(src) {
    return new Promise((resolve, reject) => { const s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = () => reject(new Error('load')); document.head.appendChild(s); });
  }
  async function ensurePdf() {
    if (!(window.jspdf && window.jspdf.jsPDF)) await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
    if (!window.jspdf.jsPDF.API.autoTable) await loadScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js');
    return window.jspdf.jsPDF;
  }

  function reportHTML() {
    return `<div class="panel"><h3 class="panel-title">${icon('doc')}Service history report</h3>
      <p class="sub" style="margin:0">A clean PDF of your schedule, every service and repair, and your tyres. Handy for a new mechanic, and it adds value when you sell.</p>
      <label class="deduct"><input type="checkbox" id="rep-costs"><span>Include costs (leave off for a buyer)</span></label>
      <div class="actions backup-actions"><button class="btn primary" type="button" data-act="make-report">${icon('download')}Create PDF</button></div></div>`;
  }

  async function makeReport(btn) {
    if (!state.downloads) return toast('Saving files isn’t available in this view. Open the app on claude.ai.');
    const includeCosts = !!($('#rep-costs') && $('#rep-costs').checked);
    const label = btn ? btn.innerHTML : '';
    if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
    try {
      const jsPDF = await ensurePdf();
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      const W = 210, M = 14;
      const RED = [209, 15, 30], INK = [22, 24, 26], MUTED = [93, 97, 102], LINE = [214, 216, 218];
      const car = state.meta.find(x => x._id === 'car') || {};
      const cur = currentKm();
      const T = (s) => String(s == null ? '' : s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"');
      doc.setFont('helvetica', 'bold'); doc.setFontSize(20); doc.setTextColor(...INK);
      doc.text('SERVICE HISTORY', M, 20);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...MUTED);
      doc.text(T([car.description || '2014 Toyota Land Cruiser Prado', car.engine || '1KD-FTV 3.0L turbo diesel', car.plate ? 'Rego ' + car.plate : ''].filter(Boolean).join('  ·  ')), M, 27);
      doc.text(T(`Odometer ${cur ? fmtKm(cur.km) + ' km' : 'not recorded'}${cur && cur.estimated ? ' (estimated)' : ''}  ·  Report created ${fmtDate(startOfToday())}`), M, 32.5);
      doc.setDrawColor(...RED); doc.setLineWidth(1); doc.line(M, 36, W - M, 36);
      const table = (y, head, body, opts = {}) => doc.autoTable(Object.assign({
        startY: y, head: [head], body, theme: 'grid', margin: { left: M, right: M },
        styles: { font: 'helvetica', fontSize: 8.6, cellPadding: 1.8, textColor: INK, lineColor: LINE, lineWidth: 0.2, valign: 'top' },
        headStyles: { fillColor: INK, textColor: 255, fontStyle: 'bold' }
      }, opts));
      const heading = (txt, y) => { doc.setFont('helvetica', 'bold'); doc.setFontSize(12); doc.setTextColor(...INK); doc.text(txt, M, y); };
      const nextY = (gap = 10) => { let y = doc.lastAutoTable.finalY + gap; if (y > 260) { doc.addPage(); y = 20; } return y; };

      // Schedule
      heading('Maintenance schedule', 45);
      const items = state.items.filter(i => i.kind !== 'oneoff').sort((a, b) => (a.order || 0) - (b.order || 0));
      const sched = items.map(i => {
        const s = statusFor(i, cur);
        return [T(i.name), T(intervalText(i).replace(/^every /, 'Every ')),
          s.last ? [s.last.km != null ? fmtKm(s.last.km) + ' km' : '', s.last.date ? fmtDate(parseDate(s.last.date)) : ''].filter(Boolean).join('\n') : 'No record',
          s.state === 'none' ? '' : [s.dueKm != null ? fmtKm(s.dueKm) + ' km' : '', s.dueDate ? fmtDate(s.dueDate) : ''].filter(Boolean).join('\n'),
          { over: 'Overdue', soon: 'Due soon', ok: 'OK', none: '-' }[s.state]];
      });
      table(48, ['Item', 'Interval', 'Last done', 'Next due', 'Status'], sched, {
        columnStyles: { 0: { cellWidth: 52 }, 4: { cellWidth: 20 } },
        didParseCell: (d) => { if (d.section === 'body' && d.column.index === 4) { const v = d.cell.raw; d.cell.styles.textColor = v === 'Overdue' ? [143, 29, 29] : v === 'Due soon' ? [176, 106, 0] : v === 'OK' ? [47, 122, 69] : MUTED; d.cell.styles.fontStyle = 'bold'; } }
      });

      // History
      let y = nextY(); heading('Service and repair history', y);
      const logs = state.logs.slice().sort((a, b) => ((+a.km || 0) - (+b.km || 0)) || String(a.date || '').localeCompare(String(b.date || '')));
      let total = 0;
      const rows = logs.map(l => {
        const work = [];
        if ((l.itemIds || []).length) work.push(l.itemIds.map(itemName).join(', '));
        (l.repairs || []).forEach(r => work.push('• ' + r));
        if (l.notes) work.push('Notes: ' + l.notes);
        if ((l.attachments || []).length) work.push('(Invoice on file)');
        if (+l.cost > 0) total += +l.cost;
        const row = [l.date ? fmtDate(parseDate(l.date)) : '-', l.km != null ? fmtKm(l.km) : '-', T(work.join('\n')), T(l.where || '')];
        if (includeCosts) row.push(+l.cost > 0 ? '$' + Number(l.cost).toLocaleString('en-AU', { maximumFractionDigits: 2 }) : '');
        return row;
      });
      const head = ['Date', 'Km', 'Work done', 'Done by']; if (includeCosts) head.push('Cost');
      const col = { 0: { cellWidth: 22 }, 1: { cellWidth: 17, halign: 'right' }, 3: { cellWidth: 30 } };
      if (includeCosts) col[4] = { cellWidth: 18, halign: 'right' };
      table(y + 3, head, rows.length ? rows : [['', '', 'No entries yet', '', ...(includeCosts ? [''] : [])]], Object.assign({ columnStyles: col },
        includeCosts && total ? { foot: [['', '', 'Total logged', '', '$' + total.toLocaleString('en-AU', { maximumFractionDigits: 0 })]], footStyles: { fillColor: [239, 239, 237], textColor: INK, fontStyle: 'bold' }, showFoot: 'lastPage' } : {}));

      // Tyres
      const tys = state.tyres.slice().sort((a, b) => (+b.fittedKm || 0) - (+a.fittedKm || 0));
      if (tys.length) {
        y = nextY(); heading('Tyres', y);
        table(y + 3, ['Tyres', 'Fitted', 'Latest tread (FL / FR / RL / RR)', 'Status'], tys.map(t => {
          const ts = tyreStats(t, cur);
          return [T([t.name, t.size].filter(Boolean).join('\n')), [t.fittedKm != null && !isBlank(t.fittedKm) ? fmtKm(t.fittedKm) + ' km' : '', t.fittedDate ? fmtDate(parseDate(t.fittedDate)) : ''].filter(Boolean).join('\n'),
            ts.last ? `${CORNERS.map(([k]) => ts.last[k] > 0 ? qtyFmt(ts.last[k]) : '-').join(' / ')} mm\n${ts.last.date ? fmtDate(parseDate(ts.last.date)) : ''}` : 'No readings',
            t.active === false ? `Replaced${t.removedKm ? ' at ' + fmtKm(t.removedKm) + ' km' : ''}` : 'Current'];
        }));
      }

      const pages = doc.getNumberOfPages();
      for (let i = 1; i <= pages; i++) {
        doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...MUTED);
        doc.text(T(`Prado Service Tracker  ·  ${car.plate || ''}  ·  Page ${i} of ${pages}`), W / 2, 290, { align: 'center' });
      }
      await state.downloads.save({ filename: `Prado-service-history-${todayISO()}.pdf`, data: doc.output('blob') });
      toast('Report saved');
    } catch (e) {
      const c = e && e.code;
      if (c !== 'declined') toast(c === 'rate_limited' ? 'A save is already open. Try again in a moment.' : e && e.message === 'load' ? 'Couldn’t load the PDF tools. Check your connection.' : 'Couldn’t create the report.');
    } finally {
      if (btn) { btn.disabled = false; btn.innerHTML = label; }
    }
  }

  /* ---------- Snap to log (photo reading) ---------- */

  // The "engine" that turns photos into data. Today it asks Claude inside claude.ai.
  // When the app moves to its own hosting, swap these two functions for on-device text reading or an API.
  const PhotoReader = {
    available: () => !!(state.sample && state.sampleImages),
    maxPhotos: () => (state.sampleImages && state.sampleImages.maxCount) || 4,
    async odometer(files, signal) {
      const cur = currentKm();
      const hint = cur && cur.base ? `For context, the last recorded reading was ${Math.round(cur.base.km)} km${cur.base.date ? ' on ' + isoDate(cur.base.date) : ''}, so the odometer should be at or above that.` : '';
      const prompt = `This is a photo of the instrument cluster of a 2014 Toyota Land Cruiser Prado. Read the ODOMETER: the total distance in km (often labelled ODO). Do not use a trip meter (TRIP A or TRIP B), the fuel range, the outside temperature or the clock. ${hint}
If instead this is a screenshot of an OBD scanner app (such as Car Scanner), do not guess the odometer: read the value labelled "Distance traveled since codes cleared" (or "Distance since DTC cleared") as "sinceCleared" and set "km" to null.
Reply with only JSON: {"km": number or null, "sinceCleared": number or null, "confidence": "high" | "medium" | "low", "note": "short reason if unsure, otherwise empty"}`;
      return state.sample.json(prompt, { images: files, modelTier: 'default', signal, cache: false });
    },
    async invoice(files, signal) {
      const items = state.items.map(i => `${i.id}: ${i.name}`).join('\n');
      const stock = state.stock.map(s => `${s._id}: ${[s.brand, s.name, s.partNo].filter(Boolean).join(' ')}`).join('\n') || '(none)';
      const prompt = `These photos are the pages of one invoice or receipt for work on, or parts for, a 2014 Toyota Land Cruiser Prado (1KD-FTV diesel). Extract the details.
Scheduled service items. Put an id in "itemIds" only when that job was clearly done (fluid renewed, part replaced, greased). An inspection or check alone does not count:
${items}
Garage stock items. Put an id in "stock" only for parts bought over the counter on a parts receipt, not parts fitted by a mechanic:
${stock}
Reply with only JSON:
{"kind": "service" | "parts" | "other",
 "date": "YYYY-MM-DD" or null,
 "km": odometer reading as a number, or null,
 "where": business name,
 "invoiceNo": string or "",
 "total": total paid including GST as a number, or null,
 "itemIds": [ids from the scheduled list],
 "repairs": [short plain-English lines for other work done, e.g. "Radiator replaced (genuine)"],
 "stock": [{"id": stock id, "qty": number, "unitPrice": number or null}],
 "notes": "one or two sentences of anything useful, e.g. findings or fluids used"}
Dates on Australian documents are day/month/year.`;
      return state.sample.json(prompt, { images: files, modelTier: 'default', signal, cache: false });
    }
  };

  const readError = (e) => ({
    not_granted: 'Claude wasn’t allowed to read photos for this page. You can still enter details by hand.',
    images_unavailable: 'Photo reading isn’t available in this view.',
    rate_limited: 'Too many requests just now. Try again in a minute.',
    session_expired: 'Sign in to Claude again, then try again.',
    image_rejected: 'That photo couldn’t be used. Try a JPEG or PNG under 20 MB.',
    refused: 'Claude couldn’t read that photo.',
    invalid_json: 'Couldn’t make sense of that photo. Try a clearer, closer shot.',
    sampling_disabled: 'Claude isn’t available for this account.'
  })[e && e.code] || 'Something went wrong reading the photo. Try again.';

  function pickPhotos(multiple) {
    return new Promise(resolve => {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'image/jpeg,image/png,image/webp'; inp.multiple = !!multiple; inp.className = 'visually-hidden';
      inp.onchange = () => { const f = [...inp.files]; inp.remove(); resolve(f); };
      document.body.appendChild(inp); inp.click();
    });
  }

  function readingSheet(title, ctl) {
    openSheet(`<h2>${esc(title)}</h2>
      <div class="reading"><span class="spin" aria-hidden="true"></span><span>Reading your photo. This usually takes 10 to 30 seconds.</span></div>
      <div class="sheet-actions"><button class="btn ghost" type="button" id="stopRead">Stop</button></div>`,
      (sheet) => { $('#stopRead', sheet).onclick = () => ctl.abort(); });
  }

  function snapChooser() {
    openSheet(`<h2>Snap to log</h2>
      <p class="sub" style="margin:0">Take or choose a photo and Claude fills in the details for you to check.</p>
      <div class="snap-opts">
        <button class="snap-opt" type="button" id="snapOdo">${icon('gauge')}<span><b>Odometer</b><span class="sub">Photo of the dash to update your km</span></span></button>
        <button class="snap-opt" type="button" id="snapInv">${icon('doc')}<span><b>Invoice or receipt</b><span class="sub">Service invoice or parts receipt. Several pages are fine.</span></span></button>
      </div>
      <div class="sheet-actions"><button class="btn ghost" type="button" data-act="close">Cancel</button></div>`,
      (sheet) => { $('#snapOdo', sheet).onclick = snapOdometer; $('#snapInv', sheet).onclick = snapInvoice; });
  }

  async function snapOdometer() {
    if (!PhotoReader.available()) return toast('Photo reading isn’t available in this view.');
    const files = (await pickPhotos(false)).slice(0, 1);
    if (!files.length) return;
    const ctl = new AbortController();
    readingSheet('Reading odometer', ctl);
    try {
      const r = await PhotoReader.odometer(files, ctl.signal);
      const sc = Math.round(Number(r && r.sinceCleared));
      if (!(Number(r && r.km) > 0) && sc > 0) {
        const a = odoAnchor();
        const ok = a && sc >= +a.counter;
        return kmSheet(null, { km: ok ? +a.offset + sc : null, scan: sc, fromScanner: true, confidence: String(r.confidence || ''), reason: ok ? '' : 'Enter today’s dash odometer too, so the scanner counter can be linked to it.' });
      }
      const km = Math.round(Number(r && r.km));
      if (!(km > 0)) { closeSheet(); return toast(r && r.note ? `Couldn’t read the odometer: ${r.note}` : 'Couldn’t find the odometer in that photo.'); }
      kmSheet(null, { km, confidence: String(r.confidence || ''), reason: String(r.note || '') });
    } catch (e) {
      closeSheet();
      if (!(e && e.code === 'cancelled')) toast(readError(e));
    }
  }

  async function snapInvoice() {
    if (!PhotoReader.available()) return toast('Photo reading isn’t available in this view.');
    const files = (await pickPhotos(true)).slice(0, PhotoReader.maxPhotos());
    if (!files.length) return;
    const ctl = new AbortController();
    readingSheet(files.length > 1 ? `Reading ${files.length} pages` : 'Reading invoice', ctl);
    try {
      const r = await PhotoReader.invoice(files, ctl.signal) || {};
      const validItems = new Set(state.items.map(i => i.id));
      const validStock = new Set(state.stock.map(s => s._id));
      const num = (v) => { const n = Number(String(v ?? '').replace(/[^0-9.]/g, '')); return n > 0 ? n : null; };
      const pf = {
        date: /^\d{4}-\d{2}-\d{2}$/.test(r.date || '') ? r.date : null,
        km: num(r.km) ? Math.round(num(r.km)) : null,
        where: String(r.where || '').slice(0, 80),
        cost: num(r.total),
        itemIds: (Array.isArray(r.itemIds) ? r.itemIds : []).map(String).filter(id => validItems.has(id)),
        repairs: (Array.isArray(r.repairs) ? r.repairs : []).map(x => String(x).trim()).filter(Boolean).slice(0, 20),
        notes: [r.invoiceNo ? `Invoice ${String(r.invoiceNo).slice(0, 30)}.` : '', String(r.notes || '').slice(0, 400)].filter(Boolean).join(' ')
      };
