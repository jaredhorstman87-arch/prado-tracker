  /* ---------- Keep or replace ---------- */

  // Defaults researched Oct 2026: new Prado Altitude about $100,200 drive-away (Sydney); 2024 Altitudes about $90,000 plus transfer costs;
  // Prado resale about 68% after 5 years; Toyota capped-price servicing about $290–330 per 6-monthly service.
  const CMP_DEF = { newPrice: 100200, nearPrice: 93000, repairGrowth: 10, newDep1: 12, newDep: 6.5, nearDep: 7, insNew: 2600, servNew: 700, interest: 6, horizon: 8 };
  const CMP_SERIES = [['keep', 'Keep yours', 'cmp-1'], ['near', 'Near-new Altitude', 'cmp-2'], ['new', 'New Altitude', 'cmp-3']];

  function cmpInputs(cur) {
    const saved = state.meta.find(x => x._id === 'compare') || {};
    const o = ownership(cur);
    const auto = {};
    // Your own servicing and repair spend per year since you bought it.
    auto.keepRepairs = o.years ? Math.round((o.c.mech + o.c.diy) / o.years / 50) * 50 : 1500;
    if (!(auto.keepRepairs > 0)) auto.keepRepairs = 1500;
    // How fast your car has been losing value, from what you paid and what it's worth now.
    auto.keepDep = o.price && o.val && o.years ? Math.round(clamp((1 - Math.pow(+o.val.value / o.price, 1 / o.years)) * 100, 2, 15) * 10) / 10 : 6;
    const ins = state.renewals.find(r => r.kind === 'insurance');
    auto.insKeep = ins && !isBlank(ins.cost) ? +ins.cost : 1400;
    const kmYear = cur && cur.rate ? cur.rate * 365 : 8000;
    auto.fuelSave = Math.round(kmYear * 2 / 100 * 2.05 / 50) * 50; // about 2 L/100 km better at about $2.05/L
    const v = { ...CMP_DEF, ...auto };
    Object.keys(saved).forEach(k => { if (k !== '_id' && !isBlank(saved[k])) v[k] = +saved[k]; });
    v.value0 = o.val ? +o.val.value : null;
    v.auto = auto; v.saved = saved; v.kmYear = kmYear;
    return v;
  }

  function cmpModel(v, T) {
    const V0 = v.value0, g = v.repairGrowth / 100, r = v.interest / 100;
    const oldVal = (t) => V0 * Math.pow(1 - v.keepDep / 100, t);
    const newVal = (t) => t === 0 ? v.newPrice : v.newPrice * (1 - v.newDep1 / 100) * Math.pow(1 - v.newDep / 100, t - 1);
    const nearVal = (t) => v.nearPrice * Math.pow(1 - v.nearDep / 100, t);
    const out = { keep: [0], near: [0], new: [0], year: { keep: [], near: [], new: [] } };
    for (let y = 1; y <= T; y++) {
      const keepY = (oldVal(y - 1) - oldVal(y)) + v.keepRepairs * Math.pow(1 + g, y - 1) + v.insKeep;
      // Newer cars: depreciation, servicing, repairs once the 5-year warranty ends, insurance, fuel saving,
      // and interest (or lost interest) on the extra money tied up compared with keeping yours.
      const tied = (val) => Math.max(0, val - oldVal(y - 1));
      const nearAge = y + 2;
      const nearY = (nearVal(y - 1) - nearVal(y)) + v.servNew + (nearAge > 5 ? 800 * Math.pow(1 + g, nearAge - 6) : 0) + v.insNew - v.fuelSave + r * tied(nearVal(y - 1));
      const newY = (newVal(y - 1) - newVal(y)) + v.servNew + (y > 5 ? 800 * Math.pow(1 + g, y - 6) : 0) + v.insNew - v.fuelSave + r * tied(newVal(y - 1));
      out.year.keep.push(keepY); out.year.near.push(nearY); out.year.new.push(newY);
      out.keep.push(out.keep[y - 1] + keepY); out.near.push(out.near[y - 1] + nearY); out.new.push(out.new[y - 1] + newY);
    }
    return out;
  }

  function cmpChart(m, T, width) {
    const H = 230, padL = 46, padR = 12, padT = 12, padB = 26;
    const W = Math.max(280, width);
    const max = Math.max(...CMP_SERIES.map(([k]) => m[k][T]));
    const step = max > 150000 ? 50000 : max > 60000 ? 20000 : 10000;
    const top = Math.ceil(max / step) * step || step;
    const x = (t) => padL + (W - padL - padR) * t / T;
    const y = (v) => padT + (H - padT - padB) * (1 - v / top);
    const grid = [];
    for (let v = 0; v <= top; v += step) grid.push(`<line x1="${padL}" x2="${W - padR}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" class="cmp-grid"/><text x="${padL - 6}" y="${(y(v) + 4).toFixed(1)}" class="cmp-ax" text-anchor="end">${v === 0 ? '$0' : '$' + Math.round(v / 1000) + 'k'}</text>`);
    const xt = [];
    for (let t = 0; t <= T; t++) if (T <= 8 || t % 2 === 0) xt.push(`<text x="${x(t).toFixed(1)}" y="${H - 8}" class="cmp-ax" text-anchor="middle">${t === 0 ? 'Now' : t + 'y'}</text>`);
    const lines = CMP_SERIES.map(([k, , cls]) => `<polyline class="cmp-line ${cls}" points="${m[k].slice(0, T + 1).map((v, t) => `${x(t).toFixed(1)},${y(v).toFixed(1)}`).join(' ')}"/>`).join('');
    return `<svg class="cmp-svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Cumulative cost over ${T} years for keeping your car, a near-new Altitude and a new Altitude">
      ${grid.join('')}${xt.join('')}${lines}
      <line class="cmp-cross" x1="0" x2="0" y1="${padT}" y2="${H - padB}" visibility="hidden"/>
      ${CMP_SERIES.map(([k, , cls]) => `<circle class="cmp-dot ${cls}" r="4.5" cx="0" cy="0" data-k="${k}" visibility="hidden"/>`).join('')}
      <rect class="cmp-hit" x="${padL}" y="0" width="${W - padL - padR}" height="${H}" fill="transparent" data-w="${W}" data-t="${T}" data-pl="${padL}" data-pr="${padR}" data-top="${top}" data-pt="${padT}" data-pb="${padB}" data-h="${H}"/>
    </svg>`;
  }

  function compareHTML(cur) {
    const v = cmpInputs(cur);
    if (v.value0 == null) return '';
    const T = v.horizon;
    const m = cmpModel(v, Math.max(T, 15));
    state.cmpModel = m;
    const width = Math.min(608, Math.max(280, (($('#view') || {}).clientWidth || 360) - 30));
    const at = (k) => m[k][T];
    const best = CMP_SERIES.slice().sort((a, b) => at(a[0]) - at(b[0]))[0];
    const keepT = at('keep');
    const cross = ['near', 'new'].map(k => ({ k, t: m[k].findIndex((c, i) => i > 0 && c < m.keep[i]) })).filter(x => x.t > 0).sort((a, b) => a.t - b.t)[0];
    const name = (k) => ({ near: 'near-new Altitude', new: 'new Altitude', keep: 'keeping yours' })[k];
    let verdict;
    if (best[0] === 'keep') verdict = `Over ${T} years, keeping yours costs about <b>${money(keepT)}</b>. That’s <b>${money(at('near') - keepT)}</b> less than a near-new Altitude and <b>${money(at('new') - keepT)}</b> less than a new one.`;
    else verdict = `Over ${T} years, a ${name(best[0])} works out <b>${money(keepT - at(best[0]))}</b> cheaper than keeping yours, on these assumptions.`;
    const crossTxt = cross ? (cross.t <= T ? `A ${name(cross.k)} overtakes keeping yours in year ${cross.t}.` : `On these numbers a ${name(cross.k)} only becomes cheaper in year ${cross.t}.`) : 'Within 15 years, replacing never becomes cheaper on these numbers.';
    // Yearly switch point: what a near-new car costs to own in its first year versus keeping yours this year.
    const keepNow = m.year.keep[0], nearNow = m.year.near[0];
    const repairsAtSwitch = Math.max(0, nearNow - (keepNow - v.keepRepairs));
    const legend = CMP_SERIES.map(([k, l, cls]) => `<li><i class="sw ${cls}"></i><span>${l}</span><b>${money(at(k))}</b></li>`).join('');
    const chips = [3, 5, 8, 10].map(k => `<button type="button" class="seg-btn" data-act="cmp-years" data-y="${k}" aria-pressed="${k === T}">${k} yrs</button>`).join('');
    const f = (id, label, val, suffix, hint) => `<div class="field"><label for="cmp-${id}">${label}</label><div class="cmp-in">${suffix === '$' ? '<span>$</span>' : ''}<input id="cmp-${id}" data-k="${id}" inputmode="decimal" value="${esc(Math.round(val * 10) / 10)}">${suffix === '%' ? '<span>%</span>' : ''}</div>${hint ? `<span class="sub">${hint}</span>` : ''}</div>`;
    const autoTag = (k) => isBlank(v.saved[k]) ? 'From your data' : 'Your number';
    return `<div class="sec"><p class="section-label">Keep or replace?</p>
      <div class="panel cmp">
        <div class="seg" role="group" aria-label="Years ahead"><span class="seg-lbl">Next</span>${chips}</div>
        <p style="margin:0">${verdict}</p>
        <div class="cmp-chart" id="cmpChart">${cmpChart(m, T, width)}<div class="cmp-tip" id="cmpTip" hidden></div></div>
        <ul class="cmp-legend">${legend}</ul>
        <p class="sub" style="margin:0">${crossTxt}</p>
        <div class="cmp-switch">${icon('wrench')}<span>Keeping yours costs about <b>${money(keepNow)}</b> this year, with <b>${money(v.keepRepairs)}</b> of that servicing and repairs. A near-new one costs about <b>${money(nearNow)}</b> in its first year. Replacing starts to pay off once your servicing and repairs run above about <b>${money(repairsAtSwitch)}</b> a year, every year.</span></div>
        <details class="cmp-ass"${state.cmpOpen ? ' open' : ''}><summary>How it works and assumptions</summary>
          <p class="sub" style="margin:0">Each line adds up what that choice costs you from today: value lost, servicing and repairs, insurance, fuel saving on the newer engine, and interest on the extra money a newer car ties up. Rego is about the same either way, so it’s left out.</p>
          <div class="cmp-grid2">
            ${f('newPrice', 'New Altitude, drive-away', v.newPrice, '$', 'Sydney drive-away, Oct 2026')}
            ${f('nearPrice', 'Near-new Altitude (2 years old)', v.nearPrice, '$', 'About 20,000 km, incl. transfer costs')}
            ${f('keepRepairs', 'Your servicing and repairs a year', v.keepRepairs, '$', autoTag('keepRepairs') + ': average since you bought it')}
            ${f('repairGrowth', 'Repairs grow each year by', v.repairGrowth, '%', 'Older cars need more work')}
            ${f('keepDep', 'Your car loses value each year', v.keepDep, '%', autoTag('keepDep') + ': what you paid down to today’s value')}
            ${f('insKeep', 'Your insurance a year', v.insKeep, '$', isBlank(v.saved.insKeep) && state.renewals.some(r => r.kind === 'insurance' && !isBlank(r.cost)) ? 'From your renewals' : 'Placeholder until you add it to renewals')}
            ${f('insNew', 'Insurance on a newer one', v.insNew, '$', 'Higher agreed value')}
            ${f('servNew', 'Servicing a newer one', v.servNew, '$', 'Toyota capped price, 2 services a year')}
            ${f('newDep1', 'New car value lost in year 1', v.newDep1, '%', 'Prados hold value well')}
            ${f('newDep', 'Then each year', v.newDep, '%', 'About 32% over 5 years in total')}
            ${f('nearDep', 'Near-new value lost each year', v.nearDep, '%', '')}
            ${f('fuelSave', 'Fuel saved a year', v.fuelSave, '$', autoTag('fuelSave') + ': about 2 L/100 km better at your km')}
            ${f('interest', 'Interest rate', v.interest, '%', 'Car loan rate, or what the cash would earn')}
          </div>
          <div class="sheet-actions"><button class="btn ghost" type="button" data-act="cmp-reset">Reset to defaults</button><span class="spacer"></span><button class="btn primary" type="button" data-act="cmp-save">Update chart</button></div>
          <p class="note" style="margin:0">This is a guide, not financial advice. It doesn’t include the hassle or risk of a big breakdown, the newer safety tech, or how much you enjoy the car, which often decide it.</p>
        </details>
      </div></div>`;
  }

  function wireCompare(view) {
    const hit = view.querySelector('.cmp-hit');
    if (!hit || !state.cmpModel) return;
    const svg = hit.ownerSVGElement, tip = $('#cmpTip', view), m = state.cmpModel;
    const d = hit.dataset, W = +d.w, T = +d.t, pl = +d.pl, pr = +d.pr, top = +d.top, pt = +d.pt, pb = +d.pb, H = +d.h;
    const x = (t) => pl + (W - pl - pr) * t / T;
    const y = (v) => pt + (H - pt - pb) * (1 - v / top);
    const cross = svg.querySelector('.cmp-cross');
    const show = (ev) => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) * (W / r.width);
      const t = clamp(Math.round((px - pl) / (W - pl - pr) * T), 0, T);
      cross.setAttribute('x1', x(t)); cross.setAttribute('x2', x(t)); cross.setAttribute('visibility', 'visible');
      svg.querySelectorAll('.cmp-dot').forEach(c => { c.setAttribute('cx', x(t)); c.setAttribute('cy', y(m[c.dataset.k][t])); c.setAttribute('visibility', 'visible'); });
      tip.innerHTML = `<b>${t === 0 ? 'Today' : `After ${t} ${t === 1 ? 'year' : 'years'}`}</b>${CMP_SERIES.slice().sort((a, b) => m[a[0]][t] - m[b[0]][t]).map(([k, l, cls]) => `<span><i class="sw ${cls}"></i>${l}<b>${money(m[k][t])}</b></span>`).join('')}`;
      tip.hidden = false;
      const left = x(t) / W * r.width;
      tip.style.left = Math.min(Math.max(left - tip.offsetWidth / 2, 0), r.width - tip.offsetWidth) + 'px';
    };
    const hide = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); svg.querySelectorAll('.cmp-dot').forEach(c => c.setAttribute('visibility', 'hidden')); };
    hit.addEventListener('pointermove', show);
    hit.addEventListener('pointerdown', show);
    hit.addEventListener('pointerleave', hide);
    const det = view.querySelector('.cmp-ass'); if (det) det.addEventListener('toggle', () => { state.cmpOpen = det.open; });
  }

  async function saveCompare(view, reset) {
    if (!state.db) return toast('Saving isn’t available in this view.');
    const prev = state.meta.find(x => x._id === 'compare') || {};
    const d = { horizon: prev.horizon || CMP_DEF.horizon };
    if (!reset) {
      const v = cmpInputs(currentKm());
      view.querySelectorAll('.cmp-ass input[data-k]').forEach(inp => {
        const k = inp.dataset.k; const n = Number(String(inp.value).replace(/[^0-9.]/g, ''));
        if (!isFinite(n) || inp.value.trim() === '') return;
        const base = k in v.auto ? v.auto[k] : CMP_DEF[k];
        // Only store numbers you changed, so automatic values keep following your data.
        if (!isBlank(prev[k]) || Math.abs(n - base) > 0.05) d[k] = n;
      });
    }
    try { await state.db.collection('meta').doc('compare').set(d); toast(reset ? 'Back to defaults' : 'Chart updated'); }
    catch (e) { toast('Couldn’t save. Check your connection and try again.'); }
  }

  async function setHorizon(y) {
    if (!state.db) return toast('Saving isn’t available in this view.');
    const { _id, ...prev } = state.meta.find(x => x._id === 'compare') || {};
    try { await state.db.collection('meta').doc('compare').set({ ...prev, horizon: y }); } catch (e) { toast('Couldn’t save. Check your connection and try again.'); }
  }

  /* ---------- Insights ---------- */

  function insightsHTML(cur) {
    const ws = state.items.filter(i => i.kind !== 'oneoff').map(i => ({ item: i, s: statusFor(i, cur) }));
    const views = [['overview', 'Overview'], ['costs', 'Costs'], ['replace', 'Keep or new'], ['story', 'Story']];
    const v = views.some(x => x[0] === state.insView) ? state.insView : 'overview';
    const body = v === 'overview' ? healthHTML(cur, ws) + runwayHTML(cur, ws)
      : v === 'costs' ? ownershipHTML(cur) + `<div class="sec"><p class="section-label">Invoices</p>${spendingHTML(cur)}</div>`
      : v === 'replace' ? (compareHTML(cur) || '<div class="empty">Add a purchase price and a current value under Costs first.</div>')
      : (lifeHTML(cur) || '<div class="empty">Log a few services to see the car’s story.</div>');
    return `<div style="display:grid;gap:18px">
      <div class="ins-nav" role="tablist" aria-label="Insights">${views.map(([k, l]) => `<button type="button" role="tab" data-act="ins-view" data-v="${k}" aria-selected="${k === v}">${l}</button>`).join('')}</div>
      ${body}
    </div>`;
  }

  // 1. Health snapshot: the state of everything at a glance.
  function healthHTML(cur, ws) {
    const tracked = ws.filter(x => x.s.state !== 'none');
    const onTrack = tracked.filter(x => x.s.state === 'ok').length;
    const due = tracked.length - onTrack;
    const none = ws.length - tracked.length;
    const pct = ws.length ? onTrack / ws.length : 0;
    const watch = state.watch.filter(w => w.status !== 'resolved');
    const watchDue = watch.filter(w => watchState(w, cur) === 'due').length;
    const ren = state.renewals.map(r => ({ r, st: renewalStatus(r) })).filter(x => x.st.daysLeft != null).sort((a, b) => a.st.daysLeft - b.st.daysLeft)[0];
    const buy = state.stock.filter(x => ['low', 'out'].includes(stockState(x))).length;
    const car = state.meta.find(x => x._id === 'car') || {};
    const since = car.purchaseKm && cur ? cur.km - car.purchaseKm : null;
    const C = 2 * Math.PI * 27;
    const ring = `<svg class="ring" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" class="ring-track"/><circle cx="32" cy="32" r="27" class="ring-fill ${due ? 's-soon' : ''}" stroke-dasharray="${(C * Math.max(pct, 0.02)).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 32 32)"/></svg>`;
    const tile = (lbl, big, sub, cls = '') => `<div class="htile ${cls}"><span class="lbl">${lbl}</span><span class="big">${big}</span><span class="sub">${sub}</span></div>`;
    return `<div class="sec"><p class="section-label">Health snapshot</p>
      <div class="hgrid">
        <div class="htile hero"><span class="nu-ring">${ring}<span class="nu-ic"><b class="pct">${Math.round(pct * 100)}%</b></span></span>
          <span class="hero-body"><span class="lbl">Schedule</span><span class="big">${onTrack} of ${ws.length} on track</span>
          <span class="sub">${due ? `${due} due soon or overdue` : 'Nothing due soon'}${none ? ` · ${none} with no record` : ''}</span></span></div>
        ${tile('Watch list', watch.length, watch.length ? (watchDue ? `${watchDue} check due` : 'Being watched') : 'Nothing open', watchDue ? 't-soon' : '')}
        ${tile('Next renewal', ren ? esc(ren.r.name.split(' (')[0]) : '–', ren ? renewWhen(ren.st) : 'Add dates', ren && ren.st.state !== 'ok' ? 't-soon' : '')}
        ${tile('Stock', buy || 'All set', buy ? `${buy} to buy` : 'Nothing low', buy ? 't-soon' : '')}
        ${tile('Since you bought it', since != null ? fmtKm(since) + ' km' : '–', car.purchaseKm ? `Bought at ${fmtKm(car.purchaseKm)} km` : 'Purchase km not set')}
        ${tile('History', state.logs.length, (() => { const d = state.logs.map(l => l.date).filter(Boolean).sort()[0]; return d ? `entries since ${fmtMonth(parseDate(d))}` : 'entries logged'; })())}
        ${tile('Your driving', cur && cur.rate ? fmtKm(cur.rate * 7) + ' km' : '–', cur && cur.rate ? `a week · about ${fmtKm(Math.round(cur.rate * 365 / 500) * 500)} km a year` : 'Needs readings a few weeks apart')}
      </div></div>`;
  }

  // 2. Service runway: what's ahead, grouped where jobs fall close together. Spacing follows km.
  function runwayHTML(cur, ws) {
    if (!cur) return '';
    const win = state.runKm || 30000;
    const rate = cur.rate || 40;
    const pts = ws.filter(x => x.s.state !== 'none').map(({ item, s }) => {
      const kmK = s.kmLeft != null ? s.kmLeft : Infinity;
      const tK = s.daysLeft != null ? s.daysLeft * rate : Infinity;
      return { item, s, k: Math.max(Math.min(kmK, tK), -1e6), byTime: tK < kmK };
    }).filter(p => isFinite(p.k) && p.k <= win).sort((a, b) => a.k - b.k);
    const groups = [];
    pts.forEach(p => { const g = groups[groups.length - 1]; if (g && p.k - g[0].k <= 2500) g.push(p); else groups.push([p]); });
    const rank = { over: 0, soon: 1, ok: 2 };
    let prevK = 0;
    const nodes = groups.map(g => {
      const k = Math.max(0, g[0].k);
      const space = clamp((k - prevK) / 1000 * 2.4, 6, 60); prevK = k;
      const worst = g.map(p => p.s.state).sort((a, b) => rank[a] - rank[b])[0];
      const atKm = Math.round((cur.km + k) / 500) * 500;
      const head = worst === 'over' ? 'Overdue now' : `In about ${fmtKm(Math.max(100, Math.round(k / 100) * 100))} km`;
      const chips = g.map(p => `<button type="button" class="rw-chip s-${p.s.state}" data-act="open-item" data-id="${esc(p.item.id)}">${icon(iconFor(p.item))}<span>${esc(p.item.name)}</span>${p.item.doneBy === 'mechanic' ? '<span class="mech-tag">Mechanic</span>' : ''}<span class="rw-when">${p.byTime && p.s.dueDate ? 'by ' + fmtDate(p.s.dueDate) : p.s.dueKm != null ? fmtKm(p.s.dueKm) + ' km' : ''}</span></button>`).join('');
      const mech = g.some(p => p.item.doneBy === 'mechanic');
      return `<li class="rw-node s-${worst}" style="margin-top:${space.toFixed(0)}px"><span class="rw-dot"></span>
        <div class="rw-body"><div class="rw-head"><b>${head}</b><span class="sub">around ${fmtKm(atKm)} km${cur.rate ? ` · ${fmtMonth(new Date(startOfToday().getTime() + Math.max(0, k) / cur.rate * DAY))}` : ''}</span></div>
        <div class="rw-chips">${chips}</div>
        ${g.length > 1 ? `<p class="rw-tip">${icon('wrench')}${mech ? 'Book these in together.' : 'Do these together.'}</p>` : ''}</div></li>`;
    }).join('');
    const chipsWin = [10000, 30000, 60000].map(k => `<button type="button" class="seg-btn" data-act="run-win" data-km="${k}" aria-pressed="${k === win}">${fmtKm(k)} km</button>`).join('');
    const months = cur.rate ? Math.round(win / cur.rate / 30.4) : null;
    return `<div class="sec"><p class="section-label">Service runway</p>
      <div class="panel">
        <div class="seg" role="group" aria-label="Look ahead"><span class="seg-lbl">Next</span>${chipsWin}</div>
        <p class="sub" style="margin:0">What’s coming up${months ? ` over about ${months} months of driving` : ''}, grouped where jobs fall close together. Tap a job for details.</p>
        <ol class="rw-list">
          <li class="rw-node now"><span class="rw-dot"></span><div class="rw-body"><div class="rw-head"><b>Now</b><span class="sub">${fmtKm(Math.round(cur.km))} km</span></div></div></li>
          ${nodes || `<li class="rw-node"><span class="rw-dot"></span><div class="rw-body"><span class="sub">Nothing falls due in the next ${fmtKm(win)} km.</span></div></li>`}
        </ol>
      </div></div>`;
  }

  // 3. The car's life story: major work plotted from purchase to today.
  function lifeHTML(cur) {
    const car = state.meta.find(x => x._id === 'car') || {};
    const short = (r) => { const t = String(r).split(/[(,:]/)[0].replace(/ replaced| fitted| renewed| kit$/gi, '').trim(); return t.length > 28 ? t.slice(0, 26).trim() + '…' : t; };
    const ev = state.logs.filter(l => l.km != null).map(l => {
      const ids = l.itemIds || [], reps = l.repairs || [];
      const major = (+l.cost >= 1000) || reps.length >= 2 || ids.some(id => ['timing-belt', 'atf', 'egr'].includes(id));
      const parts = [...reps.map(short), ...ids.map(itemName)];
      const title = parts.length > 2 ? parts.slice(0, 2).join(', ') + ` and ${parts.length - 2} more` : parts.join(', ');
      const main = state.items.find(i => i.id === ids[0]);
      return { km: +l.km, date: l.date, title, major, where: l.where, cost: +l.cost || 0, id: l._id, ic: main ? iconFor(main) : 'wrench' };
    });
    if (car.purchaseKm) ev.push({ km: +car.purchaseKm, date: car.purchaseDate || null, title: 'You bought the car', milestone: true });
    if (cur) ev.push({ km: Math.round(cur.km), date: null, title: 'Today', milestone: true, now: true });
    ev.sort((a, b) => a.km - b.km || (a.now ? 1 : b.now ? -1 : 0) || String(a.date || '9999').localeCompare(String(b.date || '9999')));
    if (ev.length < 2) return '';
    let prev = null;
    const rows = ev.map(e => {
      const gap = prev ? e.km - prev.km : 0;
      const space = prev ? clamp(gap / 1000 * 2.2, 4, 46) : 0;
      const gapLbl = prev && gap >= 3000 ? `<span class="lf-gap">${fmtKm(gap)} km</span>` : '';
      prev = e;
      const body = e.milestone
        ? `<span class="lf-title">${esc(e.title)}</span><span class="sub">${fmtKm(e.km)} km${e.date ? ' · ' + fmtDate(parseDate(e.date)) : ''}</span>`
        : `<button type="button" class="lf-btn" data-act="edit-log" data-id="${esc(e.id)}"><span class="lf-title">${esc(e.title || 'Service')}</span>
           <span class="sub">${fmtKm(e.km)} km${e.date ? ' · ' + fmtDate(parseDate(e.date)) : ''}${e.where ? ' · ' + esc(e.where) : ''}</span></button>`;
      return `<li class="lf ${e.milestone ? 'ms' : e.major ? 'major' : 'minor'}${e.now ? ' now' : ''}" style="margin-top:${space.toFixed(0)}px">${gapLbl}<span class="lf-dot">${e.milestone ? '' : icon(e.ic)}</span><span class="lf-body">${body}</span></li>`;
    }).join('');
    const majors = ev.filter(e => e.major).length;
    return `<div class="sec"><p class="section-label">The car’s story</p>
      <div class="panel"><p class="sub" style="margin:0">${majors} major ${majors === 1 ? 'job' : 'jobs'} logged. Spacing follows the km between them. Tap an entry to open it.</p>
        <ol class="life">${rows}</ol></div></div>`;
  }

  function spendingHTML(cur) {
    const rows = state.logs.map(l => ({ l, c: costSplit(l) }));
    const costed = rows.filter(r => r.c);
    const uncosted = rows.length - costed.length;
    if (!costed.length) return `<div class="empty">No costs logged yet. Add a cost when you log a service or repair and your spending shows here.</div>`;
    const add = (arr) => arr.reduce((a, r) => ({ service: a.service + r.c.service, repair: a.repair + r.c.repair, mixed: a.mixed + r.c.mixed, total: a.total + r.c.total }), { service: 0, repair: 0, mixed: 0, total: 0 });
    const tot = add(costed);
    const kmVals = [...state.logs.map(l => +l.km), ...state.odos.map(o => +o.km)].filter(n => n > 0);
    const kmStart = kmVals.length ? Math.min(...kmVals) : null;
    const driven = cur && kmStart != null ? cur.km - kmStart : 0;
    const perKm = driven >= 1000 ? tot.total / driven : null;
    const today = startOfToday(); const yearAgo = new Date(today.getTime() - 365 * DAY);
    const recent = costed.filter(r => r.l.date && parseDate(r.l.date) >= yearAgo);
    const t12 = add(recent);
    const readings = [...state.odos, ...state.logs].filter(r => r.date && +r.km > 0).map(r => ({ km: +r.km, date: parseDate(r.date) })).filter(r => r.date >= yearAgo).sort((a, b) => a.date - b.date || a.km - b.km);
    let perKm12 = null;
    if (readings.length && cur) { const span = daysBetween(readings[0].date, today); const d12 = cur.km - readings[0].km; if (span >= 60 && d12 >= 500) perKm12 = t12.total / d12; }
    const byYear = {};
    costed.forEach(r => { const y = r.l.date ? r.l.date.slice(0, 4) : 'Undated'; (byYear[y] = byYear[y] || []).push(r); });
    const years = Object.keys(byYear).sort((a, b) => a === 'Undated' ? 1 : b === 'Undated' ? -1 : b.localeCompare(a));
    const yearTotals = years.map(y => ({ y, t: add(byYear[y]) }));
    const max = Math.max(...yearTotals.map(x => x.t.total));
    const seg = (cls, v, label) => v > 0 ? `<i class="seg ${cls}" style="flex-grow:${v.toFixed(2)}" title="${label}: ${money(v)}"></i>` : '';
    const bars = yearTotals.map(({ y, t }) => `<div class="yr" title="${y}: ${money(t.total)} (servicing ${money(t.service)}, repairs ${money(t.repair)}${t.mixed ? ', mixed ' + money(t.mixed) : ''})">
        <span class="yr-label">${y}</span>
        <span><span class="yr-bar" style="width:${Math.max(2, t.total / max * 100).toFixed(1)}%">${seg('svc', t.service, 'Servicing')}${seg('rep', t.repair, 'Repairs')}${seg('mix', t.mixed, 'Mixed visit')}</span></span>
        <span class="yr-val">${money(t.total)}</span></div>`).join('');
    const top = costed.slice().sort((a, b) => b.c.total - a.c.total).slice(0, 5);
    const topHTML = top.map(({ l, c }) => `<button class="entry" type="button" data-act="edit-log" data-id="${esc(l._id)}">
        <div class="entry-top"><b>${money(c.total)}</b><span class="sub">${fmtDate(parseDate(l.date))}${l.km != null ? ' · ' + fmtKm(l.km) + ' km' : ''}</span></div>
        <div class="sub">${esc(l.where || '')}${l.where ? ' · ' : ''}${esc([...(l.repairs || []).slice(0, 2), ...(l.itemIds || []).map(id => (state.items.find(i => i.id === id) || {}).name || id)].slice(0, 3).join(', '))}${((l.repairs || []).length + (l.itemIds || []).length) > 3 ? '…' : ''}</div>
      </button>`).join('');
    const sw = (cls) => `<i class="sw ${cls}"></i>`;
    return `<div style="display:grid;gap:12px">
      <div class="panel"><div class="pl-head"><h3>By year</h3><span class="sub">${money(tot.total)} logged · ${money(t12.total)} in the last 12 months</span></div>
        <div class="legend"><span>${sw('svc')}Servicing</span><span>${sw('rep')}Repairs</span>${tot.mixed ? `<span>${sw('mix')}Mixed visit</span>` : ''}</div>
        ${bars}
      </div>
      <details class="more"><summary>Biggest costs</summary><div class="list">${topHTML}</div></details>
      <p class="note" style="margin:0">Only entries with a cost are counted${uncosted ? ` (${uncosted} without one)` : ''}.${tot.mixed ? ' A mixed visit has service items and repairs with no split. Open it and fill in “Of which repairs”.' : ''}</p>
    </div>`;
  }

  /* ---------- Watch list ---------- */

  function watchState(w, cur) {
    if (w.status === 'resolved') return 'resolved';
    const today = startOfToday();
    if ((w.checkBy && parseDate(w.checkBy) <= today) || (w.checkByKm && cur && cur.km >= w.checkByKm)) return 'due';
    return 'watching';
  }

  function watchHTML(cur) {
    if (!state.loaded.watch) return `<div class="empty">Loading your watch list…</div>`;
    const active = state.watch.filter(w => w.status !== 'resolved');
    const done = state.watch.filter(w => w.status === 'resolved');
    const pill = { due: ['soon', 'Check due'], watching: ['none', 'Watching'], resolved: ['done', 'Resolved'] };
    const card = (w) => {
      const st = watchState(w, cur);
      const last = (w.updates || []).slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')))[0];
      const noticed = [w.startKm != null ? fmtKm(w.startKm) + ' km' : '', w.startDate ? fmtDate(parseDate(w.startDate)) : ''].filter(Boolean).join(' · ');
      const check = [w.checkByKm ? fmtKm(w.checkByKm) + ' km' : '', w.checkBy ? fmtDate(parseDate(w.checkBy)) : ''].filter(Boolean).join(' or ');
      return `<button class="item" type="button" data-act="open-watch" data-id="${esc(w._id)}">
        <div class="item-head"><span class="ic-tile s-${pill[st][0]}">${icon('eye')}</span><div class="item-name">${esc(w.title)}</div><span class="pill s-${pill[st][0]}">${statusIcon(pill[st][0])}${pill[st][1]}</span></div>
        ${w.detail ? `<div class="sub clamp">${esc(w.detail)}</div>` : ''}
        <div class="sub">${noticed ? 'Noticed ' + noticed : ''}${check && st !== 'resolved' ? (noticed ? '<br>' : '') + 'Check again by ' + check : ''}</div>
        ${last ? `<div class="sub">Latest: ${esc(last.note)} (${fmtDate(parseDate(last.date))})</div>` : ''}
      </button>`;
    };
    return `<div style="display:grid;gap:12px">
      <div class="list">${active.length ? active.map(card).join('') : '<div class="empty">Nothing on the watch list. Add anything you want to keep an eye on.</div>'}</div>
      ${done.length ? `<p class="section-label">Resolved</p><div class="list">${done.map(card).join('')}</div>` : ''}
      <div class="foot"><p class="note">For things to keep an eye on between services, like a reading, a noise or a small leak. Set a “check again by” date or km and it shows as due.</p><button class="btn" type="button" data-act="add-watch">${icon('plus')}Add to watch list</button></div>
    </div>`;
  }

  function watchSheet(w) {
    const isNew = !w; const cur = currentKm();
    w = w || { title: '', detail: '', startDate: todayISO(), startKm: cur ? Math.round(cur.km) : null, status: 'watching', checkBy: null, checkByKm: null, updates: [] };
    const ups = (w.updates || []).slice().sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    openSheet(`<h2>${isNew ? 'Add to watch list' : 'Watch item'}</h2>
      <div class="field"><label for="w-title">What to watch</label><input id="w-title" value="${esc(w.title)}" placeholder="e.g. Injector readings, cylinders 1 and 2"></div>
      <div class="field"><label for="w-detail">Details</label><textarea id="w-detail" rows="3">${esc(w.detail || '')}</textarea></div>
      <div class="row2">
        <div class="field"><label for="w-sdate">Noticed on</label><input id="w-sdate" type="date" value="${esc(w.startDate || '')}"></div>
        <div class="field"><label for="w-skm">At (km)</label><input id="w-skm" inputmode="numeric" value="${w.startKm ?? ''}"></div>
      </div>
      <div class="row2">
        <div class="field"><label for="w-cdate">Check again by (date)</label><input id="w-cdate" type="date" value="${esc(w.checkBy || '')}"></div>
        <div class="field"><label for="w-ckm">or by (km)</label><input id="w-ckm" inputmode="numeric" value="${w.checkByKm ?? ''}"></div>
      </div>
      ${isNew ? '' : `<div class="field"><span class="lbl">Updates</span><div class="hist-mini">${ups.length ? ups.map(u => `<div><span>${esc(u.note)}</span><span class="sub">${fmtDate(parseDate(u.date))}${u.km ? ' · ' + fmtKm(u.km) + ' km' : ''}</span></div>`).join('') : '<span class="sub">No updates yet.</span>'}</div></div>
      <div class="field"><label for="w-note">Add an update</label><input id="w-note" placeholder="e.g. Rechecked with scan tool, all normal"></div>`}
      <div id="confirmBox"></div>
      <div class="sheet-actions">${isNew ? '' : `<button class="btn danger ghost" type="button" data-act="ask-del">Delete</button><button class="btn ghost" type="button" id="w-toggle">${w.status === 'resolved' ? 'Reopen' : 'Mark resolved'}</button><span class="spacer"></span>`}
        <button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="w-save">Save</button></div>`,
      (sheet) => {
        const num = (v) => { const n = parseInt(String(v).replace(/[^0-9]/g, ''), 10); return n > 0 ? n : null; };
        const collect = (statusOverride) => {
          const title = $('#w-title', sheet).value.trim();
          if (!title) { toast('Say what you want to keep an eye on.'); return null; }
          const updates = (w.updates || []).slice();
          const noteEl = $('#w-note', sheet); const note = noteEl ? noteEl.value.trim() : '';
          if (note) updates.push({ date: todayISO(), km: cur ? Math.round(cur.km) : null, note });
          const status = statusOverride || w.status || 'watching';
          return { title, detail: $('#w-detail', sheet).value.trim(), startDate: $('#w-sdate', sheet).value || null, startKm: num($('#w-skm', sheet).value),
            checkBy: $('#w-cdate', sheet).value || null, checkByKm: num($('#w-ckm', sheet).value), status, updates,
            resolvedDate: status === 'resolved' ? (w.resolvedDate || todayISO()) : null };
        };
        $('#w-save', sheet).onclick = async () => { const d = collect(); if (!d) return; await write(() => isNew ? state.db.collection('watch').add(d) : state.db.collection('watch').doc(w._id).set(d), isNew ? 'Added to watch list' : 'Saved'); };
        const tg = $('#w-toggle', sheet);
        if (tg) tg.onclick = async () => { const d = collect(w.status === 'resolved' ? 'watching' : 'resolved'); if (!d) return; await write(() => state.db.collection('watch').doc(w._id).set(d), d.status === 'resolved' ? 'Marked resolved' : 'Reopened'); };
        if (!isNew) wireDelete(sheet, 'this watch item', () => state.db.collection('watch').doc(w._id).delete());
      });
  }

  /* ---------- Sheets ---------- */

  function openSheet(html, onMount) {
    const root = $('#sheetRoot');
    root.innerHTML = `<div class="scrim" data-act="close-scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
    const first = root.querySelector('input, select, textarea, button');
    if (first) setTimeout(() => first.focus(), 30);
    document.body.classList.add('sheet-open');
    onMount && onMount(root.querySelector('.sheet'));
  }
  function closeSheet() { $('#sheetRoot').innerHTML = ''; document.body.classList.remove('sheet-open'); }

  // The scanner can't read the odometer on this car, but it can read "distance since codes cleared".
  // One dash reading taken at the same time links the two: odometer = offset + counter.
  function odoAnchor() { const a = state.meta.find(x => x._id === 'odoAnchor'); return a && a.offset != null && a.counter != null ? a : null; }
  function kmSheet(existing, pf) {
    const cur = currentKm();
    const anchor = odoAnchor();
    let warn = '';
    if (pf && pf.km && cur && cur.base) {
      const d = pf.km - cur.base.km;
      if (d < 0) warn = `That’s ${fmtKm(-d)} km lower than your last reading. Check the digits.`;
      else if (d > 10000) warn = `That’s ${fmtKm(d)} km more than your last reading. Check the digits.`;
    }
    openSheet(`<h2>${existing ? 'Edit reading' : 'Update km'}</h2>
      ${pf ? `<div class="from-photo${pf.confidence === 'low' || warn || !pf.km ? ' warn' : ''}">${icon(pf.confidence === 'low' || warn || !pf.km ? 'alert' : 'check')}${pf.fromScanner ? `Read the scanner counter from your screenshot: ${fmtKm(pf.scan)} km since codes cleared.` : 'Read from your photo.'}${pf.confidence ? ` (${esc(pf.confidence)} confidence)` : ''} Check it before saving.${pf.reason ? ' ' + esc(pf.reason) : ''}${warn ? ' ' + warn : ''}</div>` : ''}
      <div class="row2">
        <div class="field"><label for="f-km">Odometer (km)</label><input id="f-km" inputmode="numeric" pattern="[0-9]*" placeholder="${cur ? Math.round(cur.km) : '210000'}" value="${existing ? esc(existing.km) : pf && pf.km ? esc(pf.km) : ''}"></div>
        <div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="${existing ? esc(existing.date) : todayISO()}"></div>
      </div>
      <div class="field"><label for="f-note">Note (optional)</label><input id="f-note" placeholder="e.g. fuel fill, Shell Sutherland" value="${existing ? esc(existing.note || '') : pf && !pf.fromScanner ? 'From dash photo' : ''}"></div>
      ${existing ? '' : `<details class="more"${pf && pf.fromScanner ? ' open' : ''}><summary>From the OBD scanner</summary>
        <div class="field"><label for="f-scan">Distance since codes cleared (km)</label><input id="f-scan" inputmode="numeric" pattern="[0-9]*" value="${pf && pf.scan ? esc(pf.scan) : ''}" placeholder="${anchor ? 'e.g. ' + (+anchor.counter + 120) : 'e.g. 11881'}"></div>
        <p class="sub" id="scanHint" style="margin:0">${anchor ? `Linked on ${fmtDate(parseDate(anchor.date))}: odometer = ${fmtKm(anchor.offset)} + this counter.` : 'Enter today’s dash odometer above as well, once, to link the counter to it.'}</p>
      </details>`}
      ${!existing && !pf && PhotoReader.available() ? `<button class="btn ghost file-btn" type="button" id="kmPhoto">${icon('camera')}Read from a photo</button>` : ''}
      <div id="confirmBox"></div>
      <div class="sheet-actions">${existing ? '<button class="btn danger ghost" type="button" data-act="ask-del">Delete</button><span class="spacer"></span>' : ''}
        <button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="saveKm">Save</button></div>`,
      (sheet) => {
        const scanIn = $('#f-scan', sheet), kmIn = $('#f-km', sheet), hint = $('#scanHint', sheet);
        let kmTyped = !!(kmIn.value && !(pf && pf.fromScanner));
        kmIn.addEventListener('input', () => { kmTyped = !!kmIn.value; });
        const scanVal = () => scanIn ? parseInt(String(scanIn.value).replace(/[^0-9]/g, ''), 10) || null : null;
        const onScan = () => {
          const sc = scanVal();
          if (!sc || !hint) return;
          if (anchor && sc >= +anchor.counter) {
            if (!kmTyped) kmIn.value = +anchor.offset + sc;
            hint.textContent = `= ${fmtKm(+anchor.offset + sc)} km on the odometer (linked ${fmtDate(parseDate(anchor.date))}).`;
          } else if (anchor) {
            hint.textContent = 'The counter is lower than last time, so the codes were probably cleared. Enter today’s dash odometer above to link it again.';
            if (!kmTyped) kmIn.value = '';
          } else hint.textContent = 'Enter today’s dash odometer above as well, once, to link the counter to it.';
        };
        if (scanIn) { scanIn.addEventListener('input', onScan); onScan(); }
        $('#saveKm', sheet).onclick = async () => {
          const km = parseInt(String(kmIn.value).replace(/[^0-9]/g, ''), 10);
          const date = $('#f-date', sheet).value;
          const sc = scanVal();
          if (!km) return toast(sc ? 'Enter today’s dash odometer to link the scanner counter.' : 'Enter the odometer reading in km.');
          if (!date) return toast('Pick the date of the reading.');
          const data = { km, date, note: $('#f-note', sheet).value.trim() };
          let newAnchor = null;
          if (sc) {
            data.scan = sc;
            const computed = anchor && sc >= +anchor.counter ? +anchor.offset + sc : null;
            // A dash reading that differs from the calculation (or a reset counter) re-links the counter.
            if (computed == null || Math.abs(km - computed) > 5) newAnchor = { offset: km - sc, counter: sc, odo: km, date };
            if (!data.note) data.note = computed != null && !newAnchor ? `From scanner (counter ${fmtKm(sc)})` : `Dash, scanner linked (counter ${fmtKm(sc)})`;
          }
          await write(async () => {
            if (existing) await state.db.collection('odo').doc(existing._id).set(data); else await state.db.collection('odo').add(data);
            if (newAnchor) await state.db.collection('meta').doc('odoAnchor').set(newAnchor);
          }, existing ? 'Reading updated' : newAnchor ? 'Odometer updated, scanner linked' : 'Odometer updated');
        };
        if (existing) wireDelete(sheet, 'this reading', () => state.db.collection('odo').doc(existing._id).delete());
        const kp = $('#kmPhoto', sheet); if (kp) kp.onclick = snapOdometer;
      });
  }

  function serviceSheet(existing, preselect, opts) {
    const cur = currentKm();
    const pf = (opts && opts.prefill) || null;
    const src = existing || pf;
    const adds = (opts && opts.stockAdds) || [];
    const chosen = new Set(existing ? existing.itemIds || [] : pf ? pf.itemIds || [] : preselect || []);
    const items = state.items.slice().sort((a, b) => (a.order || 0) - (b.order || 0));
    openSheet(`<h2>${existing ? 'Edit entry' : 'Log service or repair'}</h2>
      ${pf ? `<div class="from-photo">${icon('check')}Filled in from your photo. Check everything before saving, especially the km and ticked items.</div>` : ''}
      ${!existing && !pf && PhotoReader.available() ? `<button class="btn ghost file-btn" type="button" id="svcPhoto">${icon('camera')}Fill in from an invoice photo</button>` : ''}
      <div class="row2">
        <div class="field"><label for="f-km">Odometer (km)</label><input id="f-km" inputmode="numeric" pattern="[0-9]*" placeholder="${cur ? Math.round(cur.km) : ''}" value="${src && src.km != null ? esc(src.km) : ''}"></div>
        <div class="field"><label for="f-date">Date</label><input id="f-date" type="date" value="${existing ? esc(existing.date || '') : pf ? esc(pf.date || '') : todayISO()}"></div>
      </div>
      <div class="field"><span class="lbl">What was done</span>
        <div class="checks">${items.map(i => `<label><input type="checkbox" value="${esc(i.id)}" ${chosen.has(i.id) ? 'checked' : ''}>${esc(i.name)}</label>`).join('')}</div></div>
      <div class="field"><label for="f-repairs">Repairs and other work (one per line)</label><textarea id="f-repairs" rows="3" placeholder="e.g. Radiator replaced (genuine)">${src ? esc((src.repairs || []).join('\n')) : ''}</textarea></div>
      <div class="row2">
        <div class="field"><label for="f-where">Done by</label><input id="f-where" list="whereList" placeholder="Toyota, mechanic, me" value="${src ? esc(src.where || '') : esc((opts && opts.where) || '')}"><datalist id="whereList"><option value="Toyota"><option value="Mechanic"><option value="Me (DIY)"></datalist></div>
        <div class="field"><label for="f-cost">Total cost $ (optional)</label><input id="f-cost" inputmode="decimal" value="${src && src.cost != null ? esc(src.cost) : ''}"></div>
      </div>
      <div class="field"><label for="f-rcost">Of which repairs $ (optional, for visits with both)</label><input id="f-rcost" inputmode="decimal" value="${existing && existing.repairCost != null ? esc(existing.repairCost) : ''}"></div>
      <div class="field"><label for="f-notes">Notes (parts, fluids, invoice no.)</label><textarea id="f-notes" rows="2">${src ? esc(src.notes || '') : ''}</textarea></div>
      <div class="field"><span class="lbl">Invoices and photos</span><div class="atts" id="attList"></div>
        ${state.assets ? `<label class="btn ghost file-btn" for="f-files">Add invoice or photo</label><input type="file" id="f-files" class="visually-hidden" accept="image/*,application/pdf" multiple>` : '<span class="sub">Adding files works when you open this page on claude.ai as its owner.</span>'}</div>
      ${existing ? '' : '<label class="deduct" id="deductWrap" hidden><input type="checkbox" id="f-deduct"><span id="deductTxt"></span></label>'}
      ${stockAddsHTML(adds)}
      <div id="confirmBox"></div>
      <div class="sheet-actions">${existing ? '<button class="btn danger ghost" type="button" data-act="ask-del">Delete</button><span class="spacer"></span>' : ''}
        <button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="saveSvc">Save</button></div>`,
      (sheet) => {
        const ticked = () => [...sheet.querySelectorAll('.checks input:checked')].map(c => c.value);
        // Attachments: existing files plus new ones waiting to upload on Save.
        let atts = ((existing && existing.attachments) || []).slice();
        let pending = (opts && opts.files) ? opts.files.slice() : [];
        const sp = $('#svcPhoto', sheet); if (sp) sp.onclick = snapInvoice;
        const drawAtts = () => {
          const a = atts.map((f, i) => `<div class="att">${(f.type || '').startsWith('image/') ? `<img data-file="${esc(f.id)}" alt="">` : '<span class="att-ic">PDF</span>'}<a class="att-name" data-file="${esc(f.id)}" target="_blank" rel="noopener">${esc(f.name || 'File')}</a><button type="button" class="att-x" data-rm="a${i}" aria-label="Remove ${esc(f.name || 'file')}">×</button></div>`);
          const p = pending.map((f, i) => `<div class="att"><span class="att-ic">NEW</span><span class="att-name">${esc(f.name)}</span><button type="button" class="att-x" data-rm="p${i}" aria-label="Remove ${esc(f.name)}">×</button></div>`);
          $('#attList', sheet).innerHTML = [...a, ...p].join('') || '<span class="sub">None yet.</span>';
          // Stored files open through a short-lived signed link from Supabase.
          $('#attList', sheet).querySelectorAll('[data-file]').forEach(el => window.pradoFileUrl(el.dataset.file).then(url => { el[el.tagName === 'IMG' ? 'src' : 'href'] = url; }, () => {}));
        };
        drawAtts();
        $('#attList', sheet).addEventListener('click', (e) => {
          const b = e.target.closest('[data-rm]'); if (!b) return;
          const k = b.dataset.rm; const i = +k.slice(1);
          if (k[0] === 'a') atts.splice(i, 1); else pending.splice(i, 1);
          drawAtts();
        });
        const fileIn = $('#f-files', sheet);
        if (fileIn) fileIn.addEventListener('change', () => {
          const ok = /^(image\/(png|jpeg|gif|webp)|application\/pdf)$/;
          [...fileIn.files].forEach(f => {
            if (!ok.test(f.type)) return toast(`${f.name}: use a PDF, JPEG or PNG.`);
            if (f.size > 20 * 1024 * 1024) return toast(`${f.name} is over 20 MB.`);
            pending.push(f);
          });
          fileIn.value = ''; drawAtts();
        });
        // Offer to take parts out of garage stock (new entries only).
        const deductWrap = $('#deductWrap', sheet);
        let deductTouched = false;
        const deductParts = () => partsFor(ticked()).filter(p => p.have != null && p.need > 0);
        const refreshDeduct = () => {
          if (!deductWrap) return;
          const parts = deductParts();
          deductWrap.hidden = !parts.length;
          $('#deductTxt', sheet).textContent = 'Take parts out of garage stock: ' + parts.map(p => `${p.s.name} ${p.s.unit && p.s.unit !== 'each' ? qtyFmt(p.need) + ' ' + p.s.unit : 'x' + qtyFmt(p.need)}`).join(', ');
          if (!deductTouched) $('#f-deduct', sheet).checked = /\b(me|diy)\b/i.test($('#f-where', sheet).value);
        };
        if (deductWrap) {
          $('#f-deduct', sheet).addEventListener('change', () => { deductTouched = true; });
          $('#f-where', sheet).addEventListener('input', refreshDeduct);
        }
        sheet.querySelectorAll('.checks input').forEach(cb => cb.addEventListener('change', () => {
          if (cb.checked) {
            const it = state.items.find(i => i.id === cb.value);
            (it && it.includes || []).forEach(id => { const o = sheet.querySelector(`.checks input[value="${CSS.escape(id)}"]`); if (o) o.checked = true; });
          }
          refreshDeduct();
        }));
        refreshDeduct();
        $('#saveSvc', sheet).onclick = async () => {
          const kmRaw = String($('#f-km', sheet).value).replace(/[^0-9]/g, '');
          const km = kmRaw ? parseInt(kmRaw, 10) : null;
          const date = $('#f-date', sheet).value || null;
          const itemIds = [...sheet.querySelectorAll('.checks input:checked')].map(c => c.value);
          const repairs = $('#f-repairs', sheet).value.split('\n').map(s => s.trim()).filter(Boolean);
          if (!itemIds.length && !repairs.length) return toast('Tick a schedule item or add a repair.');
          if (km == null && !date) return toast('Add the km or the date, ideally both.');
          const costRaw = $('#f-cost', sheet).value.replace(/[^0-9.]/g, '');
          const data = { km, date, itemIds, repairs, where: $('#f-where', sheet).value.trim(), cost: costRaw ? Number(costRaw) : null, repairCost: (() => { const r = $('#f-rcost', sheet).value.replace(/[^0-9.]/g, ''); return r ? Number(r) : null; })(), notes: $('#f-notes', sheet).value.trim() };
          const btn = $('#saveSvc', sheet);
          if (pending.length) {
            if (!state.assets) return toast('Adding files isn’t available in this view.');
            btn.disabled = true; btn.textContent = 'Uploading…';
            try {
              while (pending.length) {
                const f = pending[0];
                const r = await state.assets.upload(f);
                atts.push({ id: r.id, name: f.name, type: r.contentType, size: r.sizeBytes });
                pending.shift();
              }
            } catch (e) {
              btn.disabled = false; btn.textContent = 'Save'; drawAtts();
              const c = e && e.code;
              return toast(c === 'too_large' ? 'That file is too big (20 MB max).' : c === 'unsupported_type' ? 'Use a PDF, JPEG or PNG.' : c === 'quota_or_state' ? 'File storage is full.' : 'Upload failed. Try again.');
            }
            btn.disabled = false; btn.textContent = 'Save';
          }
          data.attachments = atts;
          const deduct = !existing && deductWrap && !deductWrap.hidden && $('#f-deduct', sheet).checked ? deductParts() : [];
          await write(async () => {
            if (existing) await state.db.collection('log').doc(existing._id).set(data);
            else await state.db.collection('log').add(data);
            if (adds.length) await applyStockAdds(sheet, adds, data.where, data.date);
            if (!existing && opts && opts.onSaved) await opts.onSaved();
            for (const p of deduct) {
              const { _id, ...rest } = p.s;
              await state.db.collection('stock').doc(_id).set({ ...rest, qty: Math.max(0, Math.round((p.have - p.need) * 10) / 10) });
            }
          }, existing ? 'Entry updated' : deduct.length ? 'Service logged, stock updated' : 'Service logged');
        };
        if (existing) wireDelete(sheet, 'this service entry', () => state.db.collection('log').doc(existing._id).delete());
      });
  }

  function jobFor(item) { return state.jobs.find(j => (j.itemIds || []).includes(item.id)) || null; }
  function itemSheet(item) {
    const cur = currentKm();
    const s = statusFor(item, cur);
    const hist = state.logs.filter(l => (l.itemIds || []).includes(item.id)).sort((a, b) => (+b.km || 0) - (+a.km || 0));
    openSheet(`<h2>${esc(item.name)}</h2>
      <div class="sub">${esc(item.group || '')}${item.group ? ' · ' : ''}${esc(intervalText(item))}</div>
      ${item.notes ? `<p class="note" style="margin:0">${esc(item.notes)}</p>` : ''}
      ${item.kind !== 'oneoff' && s.state !== 'none' ? `<div class="due">${dueLine(s)}</div><div class="sub">${subLine(s)}</div>` : ''}
      <div class="field"><span class="lbl">History</span>
        <div class="hist-mini">${hist.length ? hist.map(l => `<div><span>${l.km != null ? fmtKm(l.km) + ' km' : 'km unknown'}</span><span class="sub">${fmtDate(parseDate(l.date))}${l.where ? ' · ' + esc(l.where) : ''}</span></div>`).join('') : '<span class="sub">Nothing logged yet.</span>'}</div></div>
      <div class="sheet-actions"><button class="btn ghost" type="button" id="editItem">Edit item</button>${jobFor(item) ? `<button class="btn ghost" type="button" id="openJob">${icon('clipboard')}DIY card</button>` : ''}<span class="spacer"></span>
        <button class="btn primary" type="button" id="markDone">Log as done</button></div>`,
      (sheet) => {
        $('#markDone', sheet).onclick = () => serviceSheet(null, [item.id, ...(item.includes || [])]);
        $('#editItem', sheet).onclick = () => editItemSheet(item);
        const oj = $('#openJob', sheet); if (oj) oj.onclick = () => jobSheet(jobFor(item));
      });
  }

  function editItemSheet(item) {
    const isNew = !item;
    item = item || { name: '', group: '', intervalKm: null, intervalMonths: null, notes: '', kind: 'recurring' };
    openSheet(`<h2>${isNew ? 'Add item' : 'Edit item'}</h2>
      <div class="field"><label for="f-name">Name</label><input id="f-name" value="${esc(item.name)}" placeholder="e.g. Wheel bearings"></div>
      <div class="row2">
        <div class="field"><label for="f-group">Group</label><input id="f-group" list="groupList" value="${esc(item.group || '')}"><datalist id="groupList"><option value="Engine"><option value="Driveline"><option value="Brakes"><option value="Cabin"><option value="General"></datalist></div>
        <div class="field"><label for="f-kind">Type</label><select id="f-kind"><option value="recurring" ${item.kind !== 'oneoff' ? 'selected' : ''}>Recurring</option><option value="oneoff" ${item.kind === 'oneoff' ? 'selected' : ''}>One-off job</option></select></div>
      </div>
      <div class="row2">
        <div class="field"><label for="f-ikm">Every (km)</label><input id="f-ikm" inputmode="numeric" value="${item.intervalKm ?? ''}" placeholder="blank = no km limit"></div>
        <div class="field"><label for="f-imo">Or every (months)</label><input id="f-imo" inputmode="numeric" value="${item.intervalMonths ?? ''}" placeholder="blank = no time limit"></div>
      </div>
      <div class="field"><label for="f-by">Usually done by</label><select id="f-by"><option value="me" ${item.doneBy !== 'mechanic' ? 'selected' : ''}>Me (DIY)</option><option value="mechanic" ${item.doneBy === 'mechanic' ? 'selected' : ''}>Mechanic</option></select></div>
      <div class="field"><label for="f-inotes">Notes</label><textarea id="f-inotes" rows="2">${esc(item.notes || '')}</textarea></div>
      <div id="confirmBox"></div>
      <div class="sheet-actions">${!isNew ? '<button class="btn danger ghost" type="button" data-act="ask-del">Delete</button><span class="spacer"></span>' : ''}
        <button class="btn ghost" type="button" data-act="close">Cancel</button><button class="btn primary" type="button" id="saveItem">Save</button></div>`,
      (sheet) => {
        $('#saveItem', sheet).onclick = async () => {
          const name = $('#f-name', sheet).value.trim();
          if (!name) return toast('Give the item a name.');
          const num = (v) => { const n = parseInt(String(v).replace(/[^0-9]/g, ''), 10); return n > 0 ? n : null; };
          const data = { ...item, name, group: $('#f-group', sheet).value.trim(), kind: $('#f-kind', sheet).value, intervalKm: num($('#f-ikm', sheet).value), intervalMonths: num($('#f-imo', sheet).value), notes: $('#f-inotes', sheet).value.trim(), doneBy: $('#f-by', sheet).value };
          delete data._id;
          if (isNew) { data.id = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 40) + '-' + Date.now().toString(36); data.order = Math.max(0, ...state.items.map(i => i.order || 0)) + 1; data.includes = []; }
          await write(() => state.db.collection('items').doc(data.id).set(data), isNew ? 'Item added' : 'Item updated');
        };
        if (!isNew) wireDelete(sheet, `“${item.name}”. Logged services stay in History`, () => state.db.collection('items').doc(item.id).delete());
      });
  }

  function wireDelete(sheet, what, fn) {
    const btn = sheet.querySelector('[data-act="ask-del"]');
    btn.onclick = () => {
      $('#confirmBox', sheet).innerHTML = `<div class="confirm"><span>Delete ${esc(what)}? This can’t be undone.</span><div class="sheet-actions"><button class="btn ghost" type="button" id="noDel">Keep</button><button class="btn danger" type="button" id="yesDel">Delete</button></div></div>`;
      $('#noDel', sheet).onclick = () => { $('#confirmBox', sheet).innerHTML = ''; };
      $('#yesDel', sheet).onclick = () => write(fn, 'Deleted');
    };
  }

  async function write(fn, okMsg) {
    if (!state.db) return toast('Saving isn’t available in this view.');
    try { await fn(); closeSheet(); toast(okMsg); }
    catch (e) {
      const code = e && e.code;
      toast(code === 'invalid_argument' ? 'You don’t have permission to change this page.' : code === 'quota_exceeded' ? 'Storage is full. Delete some old entries.' : 'Couldn’t save. Check your connection and try again.');
    }
  }

  /* ---------- Events ---------- */

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-act]');
    if (!t) return;
    const act = t.dataset.act;
    if (act === 'close-scrim' && e.target !== t) return;
    if (act === 'close' || act === 'close-scrim') return closeSheet();
    if (act === 'open-item') { const it = state.items.find(i => i.id === t.dataset.id); if (it) itemSheet(it); }
    if (act === 'add-item') editItemSheet(null);
    if (act === 'edit-log') { const l = state.logs.find(x => x._id === t.dataset.id); if (l) serviceSheet(l); }
    if (act === 'open-renewal') { const r = state.renewals.find(v => v._id === t.dataset.id); if (r) renewalSheet(r); }
    if (act === 'add-renewal') { if (state.db) renewalSheet(null); else toast('Saving isn’t available in this view.'); }
    if (act === 'open-tyre') { const ty = state.tyres.find(v => v._id === t.dataset.id); if (ty) tyreSheet(ty); }
    if (act === 'add-tyre') { if (state.db) tyreSheet(null); else toast('Saving isn’t available in this view.'); }
    if (act === 'make-report') makeReport(t);
    if (act === 'backup-json') doBackup('json');
    if (act === 'backup-csv') doBackup('csv');
    if (act === 'go-backup') { state.tab = 'history'; render(); const bp = $('#backupPanel'); if (bp) bp.scrollIntoView({ block: 'center' }); }
    if (act === 'ins-view') { state.insView = t.dataset.v; try { localStorage.setItem('prado-insview', state.insView); } catch (e) {} render(); }
    if (act === 'cmp-years') setHorizon(+t.dataset.y);
    if (act === 'cmp-save') saveCompare($('#view'), false);
    if (act === 'cmp-reset') saveCompare($('#view'), true);
    if (act === 'car-details') { if (state.db) carDetailsSheet(); else toast('Saving isn’t available in this view.'); }
    if (act === 'set-value') { if (state.db) valueSheet(); else toast('Saving isn’t available in this view.'); }
    if (act === 'open-job') { const j = state.jobs.find(x => x._id === t.dataset.id); if (j) jobSheet(j); }
    if (act === 'open-stock') { const x = state.stock.find(v => v._id === t.dataset.id); if (x) stockSheet(x); }
    if (act === 'add-stock') { if (state.db) stockSheet(null); else toast('Saving isn’t available in this view.'); }
    if (act === 'plan-win') { state.planKm = +t.dataset.km; render(); }
    if (act === 'run-win') { state.runKm = +t.dataset.km; render(); }
    if (act === 'open-watch') { const w = state.watch.find(x => x._id === t.dataset.id); if (w) watchSheet(w); }
    if (act === 'add-watch') { if (state.db) watchSheet(null); else toast('Saving isn’t available in this view.'); }
    if (act === 'edit-odo') { const o = state.odos.find(x => x._id === t.dataset.id); if (o) kmSheet(o); }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
  let resizeT; let lastW = window.innerWidth;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (state.tab === 'spending' && Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; render(); } }, 250); });
  $('#btnKm').onclick = () => state.db ? kmSheet(null) : toast('Saving isn’t available in this view.');
  $('#btnService').onclick = () => state.db ? serviceSheet(null) : toast('Saving isn’t available in this view.');
  $('#btnSnap').onclick = () => snapChooser();
  $('#tabSchedule').onclick = () => { state.tab = 'schedule'; render(); };
  $('#tabHistory').onclick = () => { state.tab = 'history'; render(); };
  $('#tabSpending').onclick = () => { state.tab = 'spending'; render(); };
  $('#tabStock').onclick = () => { state.tab = 'stock'; render(); };
  $('#tabWatch').onclick = () => { state.tab = 'watch'; render(); };

  // New tab: start at the top of the page.
  document.querySelector('.tabs').addEventListener('click', (e) => { if (e.target.closest('button')) window.scrollTo(0, 0); });

  /* ---------- Theme ---------- */

  // Auto follows the phone's setting; Light and Dark override it. Remembered on this device only.
  const hostTheme = document.documentElement.getAttribute('data-theme');
  const THEMES = ['auto', 'light', 'dark'];
  let theme = 'auto';
  try { theme = localStorage.getItem('prado-theme') || 'auto'; } catch (e) {}
  if (!THEMES.includes(theme)) theme = 'auto';
  function applyTheme() {
    const r = document.documentElement;
    if (theme === 'auto') { if (hostTheme) r.setAttribute('data-theme', hostTheme); else r.removeAttribute('data-theme'); }
    else r.setAttribute('data-theme', theme);
    const label = theme === 'auto' ? 'Auto' : theme === 'light' ? 'Light' : 'Dark';
    const btn = $('#themeBtn');
    btn.innerHTML = `<i class="half m-${theme}" aria-hidden="true"></i><span class="visually-hidden">${label}</span>`;
    btn.title = `Theme: ${label}. Tap to change.`;
    btn.setAttribute('aria-label', `Theme: ${label}. Tap to change.`);
  }
  $('#themeBtn').onclick = () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem('prado-theme', theme); } catch (e) {}
    applyTheme();
  };
  applyTheme();

  /* ---------- Data ---------- */

  render();
  (async () => {
    const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!db) { state.unavailable = true; render(); return; }
    state.db = db;
    const sub = (path, key) => db.collection(path).onSnapshot(
      (snap) => { state[key] = snap.docs.map(d => ({ ...d.data(), _id: d.id })); state.loaded[key === 'odos' ? 'odos' : key] = true; render(); },
      () => { state.loaded[key] = true; render(); toast('Lost connection to your saved data. Reload the page.'); }
    );
    sub('items', 'items'); sub('log', 'logs'); sub('odo', 'odos'); sub('watch', 'watch'); sub('stock', 'stock'); sub('renewals', 'renewals'); sub('meta', 'meta'); sub('tyres', 'tyres'); sub('jobs', 'jobs'); sub('jobruns', 'jobruns'); sub('valuations', 'valuations');
    window.claude.use('downloads').then(d => { state.downloads = d; }).catch(() => {});
    window.claude.use('sample').then(async (smp) => {
      state.sample = smp;
      if (smp) { const lim = await smp.limits().catch(() => null); state.sampleImages = (lim && lim.images) || null; }
      $('#btnSnap').hidden = !PhotoReader.available();
    }).catch(() => {});
    window.claude.use('assets').then(a => { state.assets = a; }).catch(() => {});
  })();
})();
</script>

</body>
</html>
